}
function openLogin(){
  openSheet('acct','Open my shop on this phone',`
    <p class="hint">Use the phone number you signed up with and your 6-digit shop PIN.</p>
    <label class="fld"><span>Phone number</span><input id="ac-phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="e.g. 0712 345 678"></label>
    <label class="fld"><span>Shop PIN</span><input id="ac-pin" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="6 digits"></label>
    <p class="err" id="ac-err" hidden></p>
    <button class="btn primary wide" data-act="acct-login">Open my shop</button>
    <p class="hint sm">Forgot the PIN? Ask Doppler Shop for a new one.</p>`);
}
async function doRegister(){
  const b=sheetBody(), err=b.querySelector('#ac-err'), fail=m=>{err.textContent=m;err.hidden=false;};
  const name=b.querySelector('#ac-name').value.trim(), phone=b.querySelector('#ac-phone').value.trim();
  if(!name) return fail('Write your shop name.'); if(phone.replace(/\D/g,'').length<9) return fail('Write your phone number.');
  if(!navigator.onLine) return fail('This needs internet once. Try again when you have data.');
  try{
    const j=await api('/api/register',{method:'POST',json:{name,phone}});
    if(!j.ok) return fail(j.error==='phone-used'?'This phone number already has a shop. Tap "I already have a shop" below.':j.error==='bad-phone'?'Check the phone number.':'Could not start. Try again.');
    acct.token=j.token; takeStatus(j); S.shop=name; save();
    openSheet('acct','Your free month has started',`<p>Your shop PIN is:</p><p class="pin">${esc(j.pin)}</p>
      <p class="calc"><b>Write it down now.</b> You need it with your phone number to open your shop on another phone. It is shown only once.</p>
      <button class="btn primary wide" data-act="acct-done">I have written it down</button>`);
    render();
  }catch(e){ fail('Could not reach the server. Check the internet and try again.'); }
}
async function doLogin(){
  const b=sheetBody(), err=b.querySelector('#ac-err'), fail=m=>{err.textContent=m;err.hidden=false;};
  const phone=b.querySelector('#ac-phone').value.trim(), pin=b.querySelector('#ac-pin').value.trim();
  if(!navigator.onLine) return fail('This needs internet.');
  try{
    const j=await api('/api/login',{method:'POST',json:{phone,pin}});
    if(!j.ok) return fail(j.error==='wrong-pin'?'That PIN is not right.':j.error==='no-shop'?'No shop has that phone number.':j.error==='locked'?'Too many wrong PINs. Try again in an hour, or ask for a new PIN.':'Could not open the shop. Try again.');
    acct.token=j.token; takeStatus(j); if(j.name&&!S.shop){S.shop=j.name; save();}
    if(j.drive&&j.drive.connected){
      openSheet('acct','Welcome back',`<p>Your shop is open on this phone.</p><p class="calc">Your records are backed up in Google Drive${j.drive.email?' ('+esc(j.drive.email)+')':''}. Bring them to this phone?</p>
        <button class="btn primary wide" data-act="drive-restore-now">Bring back my records</button><button class="btn line wide" data-act="close">Not now</button>`);
    } else { closeSheet(); toast('Your shop is open on this phone'); }
    render();
  }catch(e){ fail('Could not reach the server. Check the internet and try again.'); }
}
/* backups go through the server into the shop's own Google Drive */
function scheduleBackup(ms){ if(!serverOn||!acct.token||!(acct.drive&&acct.drive.connected)) return; clearTimeout(bkTimer); bkTimer=setTimeout(()=>backupNow(false),ms); }
async function backupNow(manual){
  if(!serverOn||!acct.token||bkBusy) return false;
  if(!(acct.drive&&acct.drive.connected)){ if(manual) toast('Connect Google Drive first.'); return false; }
  if(!S.items.length){ if(manual) toast('Nothing to back up yet. Add your products first.'); return false; }
  if(!navigator.onLine){ if(manual) toast('No internet. It will back up by itself when you are online.'); return false; }
  if(!manual&&acct.bkRev===S.rev&&acct.bkAt) return true;
  bkBusy=true; const rev=S.rev;
  try{
    const j=await api('/api/backup',{method:'POST',body:JSON.stringify(S),headers:{'X-Items':String(S.items.length)}});
    if(!j.ok) throw new Error(j.error||'failed');
    acct.bkAt=Date.now(); acct.bkRev=rev; acct.bkErr=''; saveAcct(); if(manual) toast('Backed up to Google Drive'); return true;
  }catch(e){
    if(e.message==='drive-disconnected'){ acct.drive={connected:false}; acct.bkErr='Google Drive was disconnected. Connect it again.'; }
    else acct.bkErr='Could not back up just now. It will try again.';
    saveAcct(); if(manual) toast(acct.bkErr); return false;
  }finally{ bkBusy=false; refreshAcctBox(); }
}
async function restoreFromDrive(){
  if(!navigator.onLine){toast('Restoring needs internet.');return;}
  try{
    const j=await api('/api/restore');
    if(!j.ok) throw new Error(j.error||'failed');
    if(!j.data||!Array.isArray(j.data.items)) throw new Error('bad');
    S=Object.assign(blank(),j.data); cart=[]; save(); acct.bkRev=S.rev; acct.bkAt=Date.now(); saveAcct();
    closeSheet(); render(); toast('Your records are back from Google Drive');
  }catch(e){ toast(e.message==='no-backup'?'There is no backup in Drive yet.':e.message==='drive-disconnected'?'Google Drive was disconnected. Connect it again first.':'Could not get the backup. Check the internet and try again.'); }
}
function driveConnect(){
  if(!acct.token){ openStart(); return; }
  if(!navigator.onLine){ toast('Connecting Google Drive needs internet.'); return; }
  location.href=API+'/drive/start?t='+encodeURIComponent(acct.token);
}
function acctBoxHTML(){
  if(!acct.token) return `<p class="hint">Start your free month to use Doppler Shop and back up to Google Drive.</p>
    <div class="btns"><button class="btn primary" data-act="acct-start">Start my free month</button><button class="btn line" data-act="acct-login-open">I already have a shop</button></div>`;
  const d=acct.drive||{};
  const ph=String(acct.phone||''), phs=/^254\d{9}$/.test(ph)?('0'+ph.slice(3)).replace(/^(\d{4})(\d{3})(\d{3})$/,'$1 $2 $3'):ph;
  return `<p class="calc">${esc(acct.name||S.shop||'')} · ${esc(phs)}<br>${acctLine()}</p>
    ${acct.status!=='paid'?'<button class="linkbtn" data-act="paywall" style="color:var(--brand);align-self:flex-start">How to pay</button>':''}
    <p class="hint" style="font-weight:700;margin-bottom:-6px">Google Drive backup</p>
    ${d.connected?`<p class="calc ${acct.bkErr?'bad':''}">${acct.bkErr?esc(acct.bkErr):acct.bkAt?`Connected${d.email?' to <b>'+esc(d.email)+'</b>':''}. Last backup <b>${day(acct.bkAt)} at ${hhmm(acct.bkAt)}</b>. It backs up by itself.`:`Connected${d.email?' to <b>'+esc(d.email)+'</b>':''}. Not backed up yet.`}</p>
      <div class="btns"><button class="btn primary" data-act="drive-backup">Back up now</button><button class="btn soft" data-act="drive-restore">Restore from Drive</button></div>`
     :`<p class="hint">Keeps a copy of everything in your own Google Drive. It backs up by itself once connected.</p><button class="btn primary wide" data-act="drive-connect">Connect Google Drive</button>`}`;
}
function refreshAcctBox(){const box=sheetKind==='settings'&&$('#acct-box'); if(box) box.innerHTML=acctBoxHTML();}
/* back from Google after connecting Drive */
function driveReturn(){
  const q=new URLSearchParams(location.search), r=q.get('drive'); if(!r) return;
  history.replaceState(null,'',location.pathname);
  if(r==='ok'){ acct.drive=Object.assign({},acct.drive,{connected:true}); saveAcct(); toast('Google Drive connected. Backing up now…'); refreshStatus().then(()=>backupNow(false)); }
  else toast(r==='cancelled'?'Google Drive was not connected.':'Could not connect Google Drive. Try again.');
}

/* settings */
function openSettings(){
  const standalone=(()=>{try{return matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;}catch(e){return false;}})();
  openSheet('settings','Settings',`
    <label class="fld"><span>Shop name</span><input id="st-name" value="${esc(S.shop||'')}" placeholder="e.g. Mama's duka" autocomplete="off"></label>
    <button class="btn primary wide" data-act="st-name">Save name</button>
    <p class="calc">${storageOk?'Everything is saved on this phone and works without internet.':'This browser is blocking storage, so nothing will be kept after you close the page.'}</p>
    ${installEvt?'<button class="btn soft wide" data-act="install">Put the app on the home screen</button>':standalone?'':'<p class="hint">To put it on the home screen: in Chrome, tap ⋮ then <b>Add to Home screen</b>. On iPhone, tap Share then <b>Add to Home Screen</b>.</p>'}
    ${serverOn?`<p class="hint" style="font-weight:700;margin-bottom:-6px">Your Doppler Shop account</p><div class="sb" id="acct-box">${acctBoxHTML()}</div>`:''}
    <p class="hint" style="font-weight:700;margin-bottom:-6px">Backup as text</p>
    <button class="btn soft wide" data-act="st-copy">Copy backup</button>
    <label class="fld"><span>Paste a backup to restore it</span><textarea id="st-backup" spellcheck="false"></textarea></label>
    <p class="err" id="st-err" hidden></p>
    <button class="btn line wide" data-act="st-restore">Restore backup</button>
    <button class="btn danger wide" data-act="st-clear">Delete everything</button>`);
}
function arm(btn,key,text,fn){
  if(armed===key){armed=null;fn();return;}
  armed=key; btn.dataset.o=btn.dataset.o||btn.textContent; btn.textContent=text; btn.classList.add('armed');
  setTimeout(()=>{if(armed===key){armed=null;btn.textContent=btn.dataset.o;btn.classList.remove('armed');}},4000);
}

/* ---------- events ---------- */
const VIEW_ONLY_BLOCK=new Set(['pick','pk','cart','pay','deni-open','deni-save','undo','product','delivery','delivery-save','dl-newsize','repack','repack-save','rp',
  'add-debt','debt-save','db-size','db-q','paid','paid-save','ret','sale-cancel','de-save','de-del','pr-rename-save','size-add','product-del','dl-file','imp-save']);
document.addEventListener('click',e=>{
  const a=e.target.closest('[data-act]'); if(!a) return;
  const b=sheetBody(), act=a.dataset.act;
  if(VIEW_ONLY_BLOCK.has(act)&&locked()){ openPaywall(); return; }
  switch(act){
    case 'tab': tab=a.dataset.tab; closeSheet(); $('#toast').hidden=true; render(); scrollTo(0,0); break;
    case 'period': period=a.dataset.p; render(); break;
    case 'sales': openSales(); break;
    case 'sales-more': openSales(+a.dataset.n); break;
    case 'sale': openSale(a.dataset.id); break;
    case 'ret': returnOne(a.dataset.id,+a.dataset.i); break;
    case 'sale-cancel': arm(a,'sc'+a.dataset.id,'Tap again to cancel this sale',()=>cancelSale(a.dataset.id)); break;
    case 'sfilter': stockFilter=a.dataset.f; render(); break;
    case 'pick': {const ps=packsOf(a.dataset.id); if(ps.length===1){cartAdd(ps[0].id,1); drawTiles(); cartBar();} else openPicker(a.dataset.id); break;}
    case 'pk': {cartAdd(a.dataset.id,+a.dataset.d); const id=sheet&&sheet.dataset.item; if(id) b.innerHTML=pickerHTML(id); drawTiles(); cartBar(); break;}
    case 'more': if(a.dataset.w==='stock'){stockN+=PAGE;drawCards();} else {showN+=PAGE;drawTiles();} break;
    case 'cart': openCart(); break;
    case 'inc': {const c=cart[+a.dataset.i]; if(c.k==='pack') cartAdd(c.packId,1); refreshCart(); break;}
    case 'dec': {const c=cart[+a.dataset.i]; if(--c.qty<=0) cart.splice(+a.dataset.i,1); refreshCart(); break;}
    case 'del': cart.splice(+a.dataset.i,1); refreshCart(); break;
    case 'clear': cart=[]; closeSheet(); render(); break;
    case 'pay': sell(a.dataset.pay); break;
    case 'deni-open': b.querySelector('#deni-box').hidden=false; a.classList.add('on'); b.querySelector('#deni-name').focus(); break;
    case 'deni-save': {const n=b.querySelector('#deni-name').value.trim(); if(!n){b.querySelector('#deni-err').hidden=false;return;} const ex=customers().find(k=>k.toLowerCase()===n.toLowerCase()); sell('deni',ex||n); break;}
    case 'undo': undo(); break;
    case 'item': openItem(a.dataset.id); break;
    case 'product': {const pre=sheetKind==='delivery'&&!a.dataset.id?b.querySelector('#dl-name').value.trim():(tab==='sell'&&!a.dataset.id&&!sheet?findQ.trim():''); if(!a.dataset.id){openAdd(pre);break;} openProduct(a.dataset.id); break;}
    case 'aw-back': {const f=$('#pf'); if(f&&f.classList.contains('wiz')){const r=[...f.querySelectorAll('.s-label')].map(i=>i.value.trim()).filter(Boolean); if(r.length) AW.sizes=r;} awStep1(); break;}
    case 'aw-change': {const f=$('#pf'); f.querySelector('.choice').classList.remove('picked'); a.hidden=true; break;}
    case 'size-add': {const box=$('#pf-sizes'); box.insertAdjacentHTML('beforeend',sizeRow({},pfKind(),pfUnitVal(),!!$('#pf').dataset.new)); wireSize(box.lastElementChild); box.lastElementChild.querySelector('.s-label').focus(); break;}
    case 'size-del': {const rows=document.querySelectorAll('#pf-sizes .size'); if(rows.length>1) a.closest('.size').remove(); else {a.closest('.size').querySelectorAll('input').forEach(i=>i.value='');} pfCheck(); break;}
    case 'product-del': arm(a,'pd','Tap again to delete. Past sales stay.',()=>{const id=a.dataset.id, n=itName(item(id)); remember(item(id)); S.items=S.items.filter(i=>i.id!==id); S.packs=S.packs.filter(p=>p.itemId!==id); cart=cart.filter(c=>c.k==='pack'?pack(c.packId):item(c.itemId)); closeSheet(); commit(); toast(`Deleted ${n}`);}); break;
    case 'delivery': openDelivery(a.dataset.id); break;
    case 'delivery-save': dlSave(); break;
    case 'dl-newsize': {const box=b.querySelector('#dl-rows'); box.insertAdjacentHTML('beforeend',dlRow(null)); const r=box.lastElementChild, l=r.querySelector('.dl-label');
      suggest(l,raw=>sizeOptions(raw,'ready','pcs'),null,r.querySelector('.x'),true); l.addEventListener('blur',()=>{const t=tidyReady(l.value); if(t!==l.value){l.value=t;dlCalc();}}); l.focus(); break;}
    case 'dl-delrow': a.closest('.dl-row').remove(); dlCalc(); break;
    case 'dl-pick': b.querySelector('#dl-name').value=a.dataset.v; dlDraw(); break;
    case 'dl-file': pickSheetFile(); break;
    case 'imp-del': a.closest('.imp').remove(); impSum(); break;
    case 'imp-save': impSave(); break;
    case 'repack': openRepack(a.dataset.id); break;
    case 'rp': {const i=b.querySelector('#rp-'+a.dataset.id); i.value=Math.max(0,(parseInt(i.value)||0)+(+a.dataset.d)); rpCalc(b.querySelector('#rp-save').dataset.id); break;}
    case 'repack-save': rpSave(a.dataset.id); break;
    case 'add-debt': openAddDebt(); break;
    case 'debt-save': {const n=b.querySelector('#db-name').value.trim(), amt=toNum(b.querySelector('#db-amt').value), err=b.querySelector('#db-err');
      if(!n){err.textContent='Write who owes you.';err.hidden=false;return;} if(!(amt>0)){err.textContent='Enter the amount.';err.hidden=false;return;}
      const ts=tsFromIso(b.querySelector('#db-date').value); if(!ts){err.textContent='Pick a date that is today or earlier.';err.hidden=false;return;}
      const ex=customers().find(k=>k.toLowerCase()===n.toLowerCase()), who=ex||n, note=b.querySelector('#db-note').value.trim();
      if(dbLines.length){
        const lines=dbLines.map(l=>{const p=pack(l.packId),it=item(p.itemId);return {k:'pack',packId:p.id,itemId:it.id,name:fullName(it,p),qty:l.qty,units:r3(p.size*l.qty),price:p.price*l.qty,cost:(p.cost||0)*l.qty};});
        const sale={id:uid(),ts,lines,total:lines.reduce((a,l)=>a+l.price,0),cost:lines.reduce((a,l)=>a+l.cost,0),pay:'deni',customer:who,note};
        applySale(sale,-1); S.sales.push(sale); dbLines=[]; closeSheet(); commit(); toast(`${who} owes ${ksh(sale.total)} more. Stock updated.`); break;
      }
      S.debts.push({id:uid(),ts,customer:who,amount:amt,note}); closeSheet(); commit(); toast(`${who} owes ${ksh(amt)} more`); break;}
    case 'db-size': dbAdd(a.dataset.id,1); b.querySelector('#db-prod').value=''; b.querySelector('#db-sizes').hidden=true; break;
    case 'db-q': dbAdd(a.dataset.id,+a.dataset.d); break;
    case 'db-entry': openDebtEntry(a.dataset.k,a.dataset.id); break;
    case 'de-save': saveDebtEntry(a.dataset.k,a.dataset.id); break;
    case 'de-del': arm(a,'dd'+a.dataset.id,'Tap again to delete',()=>deleteDebtEntry(a.dataset.k,a.dataset.id)); break;
    case 'pr-rename': b.querySelector('#pr-rename').hidden=false; a.hidden=true; b.querySelector('#pr-name').focus(); break;
    case 'pr-rename-save': {const from=a.dataset.c, to=b.querySelector('#pr-name').value.trim(); if(!to) return; const ex=customers().find(c=>c.toLowerCase()===to.toLowerCase()&&c!==from);
      renameCustomer(from,ex||to); commit(); openPerson(ex||to); toast(ex?`Joined with ${ex}`:'Name changed'); break;}
    case 'db-day': b.querySelector('#db-date').value=isoDay(Date.now()-(+a.dataset.d)*DAY); break;
    case 'person': openPerson(a.dataset.c); break;
    case 'paid': openPaid(a.dataset.c); break;
    case 'pd-set': b.querySelector('#pd-amt').value=a.dataset.v; break;
    case 'paid-save': {const c=a.dataset.c, amt=toNum(b.querySelector('#pd-amt').value), err=b.querySelector('#pd-err'), owed=Math.max(0,(balances()[c]||{owed:0}).owed);
      if(!(amt>0)){err.textContent='Enter the amount they paid.';err.hidden=false;return;}
      if(amt>owed+0.5){err.textContent=`That is more than the ${ksh(owed)} they owe.`;err.hidden=false;return;}
      S.payments.push({id:uid(),ts:Date.now(),customer:c,amount:amt,method:a.dataset.m}); closeSheet(); commit();
      const left=owed-amt; toast(`${c} paid ${ksh(amt)} by ${payName(a.dataset.m)}. `+(left>0.5?`${ksh(left)} still owed.`:'Debt cleared.')); break;}
    case 'settings': openSettings(); break;
    case 'acct-start': openStart(); break;
    case 'acct-login-open': openLogin(); break;
    case 'acct-register': doRegister(); break;
    case 'acct-login': doLogin(); break;
    case 'acct-done': closeSheet(); render(); toast('Your free month has started'); break;
    case 'acct-check': toast('Checking…'); refreshStatus().then(()=>{ if(!locked()){closeSheet(); render(); toast(acct.status==='paid'?'Thank you! Your shop is open.':'Your shop is open.');} else toast('Payment not recorded yet. Try again in a little while.'); }); break;
    case 'paywall': openPaywall(); break;
    case 'drive-connect': driveConnect(); break;
    case 'drive-backup': backupNow(true); break;
    case 'drive-restore': arm(a,'drr','Tap again: this replaces everything on this phone',()=>restoreFromDrive()); break;
    case 'drive-restore-now': restoreFromDrive(); break;
    case 'st-name': S.shop=b.querySelector('#st-name').value.trim(); closeSheet(); commit(); break;
    case 'install': if(installEvt){installEvt.prompt(); installEvt.userChoice.finally(()=>{installEvt=null;closeSheet();});} break;
    case 'st-copy': {const txt=JSON.stringify(S), ta=b.querySelector('#st-backup'), fb=()=>{ta.value=txt;ta.select();toast('Select all the text in the box and copy it.');};
      try{navigator.clipboard.writeText(txt).then(()=>toast('Backup copied. Paste it somewhere safe, like WhatsApp to yourself.'),fb);}catch(x){fb();} break;}
    case 'st-restore': {let d=null; try{d=JSON.parse(b.querySelector('#st-backup').value);}catch(x){}
      if(!d||!Array.isArray(d.items)){const er=b.querySelector('#st-err');er.textContent='That is not a Doppler Shop backup. Paste the whole text.';er.hidden=false;return;}
      arm(a,'rs','Tap again to replace everything',()=>{S=Object.assign(blank(),d);cart=[];closeSheet();commit();toast('Backup restored');}); break;}
    case 'st-clear': arm(a,'cl','Tap again: this deletes all products and sales',()=>{S=blank();cart=[];closeSheet();tab='sell';commit();toast('Everything deleted');}); break;
    case 'close': closeSheet(); break;
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape') closeSheet();});
addEventListener('online',()=>{render();refreshStatus();scheduleBackup(3000);}); addEventListener('offline',render);
addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;});
addEventListener('appinstalled',()=>{installEvt=null;toast('Done. Open Doppler Shop from your home screen.');});

load(); render(); driveReturn(); setTimeout(refreshStatus,1500); scheduleBackup(5000); setInterval(()=>scheduleBackup(1000),15*60000); setInterval(refreshStatus,6*3600000);
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist();}catch(e){}
})();
