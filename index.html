<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Doppler Shop</title>
<meta name="description" content="Sales, stock and debts for a small shop. Works offline.">
<meta name="theme-color" content="#F6F4EA">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: one calm column (max 680px), header with shop name, four labelled tabs at the bottom, every form in a bottom sheet. */
:root{
  /* brand: blue #0B3D91, cream #F6F4EA */
  --bg:#F6F4EA; --sand:#ECE8D9; --sand-press:#E1DCC8; --brand:#0B3D91; --brand-deep:#082D6B; --brand-soft:#E2E8F4;
  --surface:#FFFFFF; --ink:#18213A; --muted:#5E6577; --line:#E2DED0; --good:#1D7A4C;
  --bad:#A4442F; --bad-soft:#F2E0D9; --warn:#86621A; --warn-soft:#F3EAD6;
  --font:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg)}
body{color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;padding-top:env(safe-area-inset-top,0px);min-height:100vh;-webkit-tap-highlight-color:transparent;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.col{max-width:680px;margin:0 auto}

/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg)}
header .col{display:flex;align-items:center;gap:10px;padding-block:14px 8px}
header .logo{height:42px;width:auto;flex:none;display:block}
header .grow{flex:1}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
header h1{flex:1;min-width:0;margin:0;font-weight:800;font-size:1.25rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{font-size:.78rem;font-weight:700;border-radius:999px;padding:4px 10px;background:var(--warn-soft);color:var(--warn)}
.gear{width:42px;height:42px;border-radius:14px;border:0;background:var(--surface);display:grid;place-items:center;color:var(--muted)}
.gear svg{width:20px;height:20px}

main{padding-block:6px 250px}
.vh{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0 14px}
.vh h2{flex:1;margin:0;font-weight:800;font-size:1.65rem;letter-spacing:-.01em}

/* buttons */
.btn{border:0;border-radius:14px;padding:11px 16px;font-weight:700;min-height:46px;display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--surface);color:var(--ink)}
.btn.primary{background:var(--brand);color:#fff}
.btn.soft{background:var(--sand)}
.btn.line{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.danger{background:transparent;color:var(--bad);box-shadow:inset 0 0 0 1.5px var(--bad)}
.btn.danger.armed{background:var(--bad);color:#fff}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btns{display:flex;gap:8px}
.btns .btn{flex:1}

/* sell */
.find{display:flex;gap:8px;margin-bottom:14px}
.find input{flex:1;min-width:0;border:0;border-radius:14px;background:var(--surface);padding:12px 14px;min-height:48px}
.find input:focus{outline:2px solid var(--brand)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{position:relative;border:0;border-radius:18px;background:var(--sand);text-align:left;padding:11px 12px 10px;display:flex;flex-direction:column;gap:1px;transition:transform .08s ease,background .08s}
.tile.picked{box-shadow:inset 0 0 0 2.5px var(--brand)}
.tile:active{transform:scale(.96);background:var(--sand-press)}
.t-name{font-size:1.02rem;font-weight:800;line-height:1.2;padding-right:30px;overflow-wrap:anywhere}
.t-sub{font-size:.8rem;font-weight:600;color:var(--muted)}
.t-foot{margin-top:auto;padding-top:6px;display:flex;align-items:baseline;justify-content:space-between;gap:6px;min-width:0}
.t-price{font-weight:700;white-space:nowrap}
.t-flag{font-size:.72rem;font-weight:700;color:var(--warn);white-space:nowrap}
.t-flag.out{color:var(--bad)}
.t-n{position:absolute;top:8px;right:8px;min-width:26px;height:26px;padding:0 7px;border-radius:13px;background:var(--brand-deep);color:#fff;font-weight:800;display:grid;place-items:center;font-size:.92rem}
.hint.sm{font-size:.82rem;margin:-6px 0 10px}
.muted{color:var(--muted);font-weight:600}
.more{margin-top:12px}
.linkbtn{border:0;background:none;padding:2px 0;color:var(--bad);font-weight:700;font-size:.82rem;text-decoration:underline;text-underline-offset:3px}
.nomatch{color:var(--muted);text-align:center;padding:24px 0}

#cartbar{position:fixed;left:0;right:0;bottom:calc(70px + env(safe-area-inset-bottom,0px));z-index:25}
#cartbar .col{padding-bottom:8px}
#cartbar .finish{width:100%;border:0;border-radius:18px;background:var(--brand);color:#fff;display:flex;align-items:center;gap:10px;padding:15px 18px;font-weight:800;font-size:1.05rem;box-shadow:0 10px 24px -14px rgba(39,43,34,.6)}
#cartbar .amt{margin-left:auto}
body.has-cart #toast{bottom:calc(196px + env(safe-area-inset-bottom,0px))}
.cstrip{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.cstrip::-webkit-scrollbar{display:none}
.dayh{margin:6px 0 -6px;font-weight:800;font-size:.9rem;color:var(--muted)}
.slist{padding:0 12px}
.srow{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;align-items:center;gap:10px;width:100%;border:0;background:none;text-align:left;padding:11px 0;border-bottom:1px solid var(--line);font-size:.92rem}
.slist .srow:last-child{border-bottom:0}
.srow .st{color:var(--muted);font-weight:700;font-size:.82rem}
.srow .si{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .sp{font-size:.72rem;font-weight:800;border-radius:6px;padding:2px 6px;background:var(--bg);color:var(--muted)}
.srow .sp.deni{background:var(--warn-soft);color:var(--warn)}
.srow .sa{font-weight:800;text-align:right;min-width:64px}
.cats{display:flex;flex-direction:column;gap:8px;margin-top:-4px}
.cats .chips .chip{min-height:36px;padding:6px 13px;font-size:.88rem}
#pf-cat-items{max-height:190px;overflow:auto}
.dl-row{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,.8fr) auto;gap:8px;align-items:end;padding:10px 0;border-bottom:1px solid var(--line)}
.panel>.dl-row:last-child{border-bottom:0}
.dl-row .dl-l{align-self:center;min-width:0}
.dl-row .dl-l b{display:block;font-weight:800}
.dl-row .dl-l small{color:var(--muted);font-size:.78rem}
.dl-row .fld input{background:var(--bg);min-height:42px;padding:9px 10px}
.dl-row .fld>span{white-space:nowrap}
.dl-row .x{background:var(--bg);margin-bottom:1px}
.dl-row .sugg{grid-column:1/-1}
.panel>.dl-row[data-pid]:not(.new) .x{display:none}
.kvb{width:100%;border:0;background:none;text-align:left;font:inherit;color:inherit;cursor:pointer}
.kvb .chev{font-size:1rem;margin-left:4px}
#db-sizes{margin-top:-6px}
.photo{display:flex;justify-content:center;gap:8px;min-height:42px;font-size:.92rem;margin-top:-6px;width:100%}
.photo svg{width:20px;height:20px}
.photo-res .pr-top{display:flex;gap:10px;align-items:flex-start}
.photo-res img{width:56px;height:56px;object-fit:cover;border-radius:10px;flex:none}
.cchip{display:inline-flex;align-items:center;gap:4px;flex:none;background:var(--surface);border-radius:999px;padding:3px 3px 3px 12px;font-weight:700;font-size:.85rem;white-space:nowrap;box-shadow:0 2px 8px -4px rgba(39,43,34,.35)}
.cchip button{width:32px;height:32px;border:0;border-radius:50%;background:var(--bad-soft);color:var(--bad);font-size:1.1rem;font-weight:800;line-height:1}
.tile.soldout{opacity:.5}
.prow.soldout .pl b{color:var(--muted)}
.step button:disabled{opacity:.35}

/* tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:26;background:var(--surface);padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -1px 0 var(--line)}
nav.tabs .col{display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{border:0;background:none;min-height:70px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-weight:700;font-size:.82rem;color:var(--muted)}
nav.tabs svg{width:24px;height:24px}
nav.tabs .on{color:var(--brand-deep)}
nav.tabs .on .ic{background:var(--brand-soft)}
nav.tabs .ic{width:56px;height:30px;border-radius:15px;display:grid;place-items:center}

/* lists */
.panel{background:var(--surface);border-radius:18px;padding:4px 16px}
.row{display:flex;align-items:center;gap:12px;padding:14px 0;width:100%;border:0;background:none;text-align:left;border-bottom:1px solid var(--line)}
.panel>.row:last-child,.panel>div>.row:last-child{border-bottom:0}
.row .main{flex:1;min-width:0}
.row .main b{display:block;font-weight:800}
.row .main small{display:block;color:var(--muted);font-size:.85rem;overflow:hidden;text-overflow:ellipsis}
.row .chev{color:var(--muted);font-size:1.3rem}
.row .amt{font-weight:800}
.flag{font-size:.75rem;font-weight:800;border-radius:8px;padding:3px 8px;background:var(--warn-soft);color:var(--warn);white-space:nowrap}
.flag.out{background:var(--bad-soft);color:var(--bad)}
.sec{font-weight:800;font-size:.95rem;margin:20px 0 8px}

/* stock */
.stats{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.6fr) minmax(0,1fr);background:var(--surface);border-radius:18px;padding:14px 4px}
.stats>div{display:flex;flex-direction:column;align-items:center;gap:2px;padding:0 6px;min-width:0;text-align:center}
.stats>div+div{border-left:1px solid var(--line)}
.stats .l{font-size:.75rem;font-weight:700;color:var(--muted)}
.stats b{font-size:1.1rem;font-weight:800;white-space:nowrap}
.stats .l{white-space:nowrap}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px;margin-top:12px}
.card{border:0;background:var(--surface);border-radius:18px;padding:12px 14px;text-align:left;display:flex;flex-direction:column;gap:10px;width:100%}
.card:active{background:#FBFAF4}
.c-top{display:flex;align-items:center;gap:12px}
.av{width:44px;height:44px;border-radius:14px;background:var(--sand);color:var(--brand-deep);display:grid;place-items:center;font-weight:800;font-size:.95rem;flex:none}
.c-name{flex:1;min-width:0}
.c-name b{display:block;font-weight:800;font-size:1.05rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-name b .flag{font-size:.7rem;padding:2px 7px;vertical-align:2px;margin-left:4px}
.c-side{display:flex;flex-direction:column;align-items:flex-end;flex:none;text-align:right}
.c-side b{font-weight:800;font-size:.98rem}
.c-side small{color:var(--muted);font-size:.78rem}
.sz.bulkc{background:var(--brand-soft);color:var(--brand-deep)}
.c-name small{color:var(--muted);font-size:.8rem}
.sack-top{display:flex;justify-content:space-between;font-size:.88rem;color:var(--muted);margin-bottom:6px}
.sack-top b{color:var(--ink);font-weight:800}
.meter{height:10px;border-radius:5px;background:var(--bg);overflow:hidden}
.meter i{display:block;height:100%;border-radius:5px;background:var(--brand)}
.meter i.low{background:#C99A2E}.meter i.out{background:var(--bad)}
.szs{display:flex;flex-wrap:wrap;gap:6px}
.sz{display:inline-flex;align-items:center;gap:8px;background:var(--sand);border-radius:10px;padding:6px 10px;font-size:.88rem;font-weight:600}
.sz b{font-weight:800}
.sz.out{background:var(--bad-soft);color:var(--bad)}
.c-foot{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:.85rem;border-top:1px solid var(--line);padding-top:10px}

/* report */
.seg{display:flex;background:var(--surface);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:none;border-radius:10px;padding:9px 6px;font-weight:700;color:var(--muted);min-height:40px}
.seg button[aria-pressed="true"]{background:var(--sand);color:var(--ink)}
.big{background:var(--surface);border-radius:18px;padding:18px;margin-top:12px}
.big .l{color:var(--muted);font-weight:700;font-size:.82rem}
.big .v{font-weight:800;font-size:1.8rem;line-height:1.15;margin:2px 0;overflow-wrap:anywhere}
.big .s{color:var(--muted);font-size:.82rem}
.up{color:var(--good);font-weight:800}.down{color:var(--bad);font-weight:800}
.split2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.split2 span{display:block;color:var(--muted);font-weight:700;font-size:.78rem}
.split2 b{font-weight:800;font-size:1.02rem}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.pair>div{background:var(--surface);border-radius:18px;padding:14px 16px;min-width:0}
.pair .l{color:var(--muted);font-weight:700;font-size:.8rem}
.pair .v{font-weight:800;font-size:1.2rem;overflow-wrap:anywhere}
.kv{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:.92rem}
.kv:last-child{border-bottom:0}
.kv span:last-child{font-weight:800}
.chart{background:var(--surface);border-radius:18px;padding:16px 12px 8px}
.chart svg{width:100%;height:auto;display:block}

/* empty */
.empty{background:var(--surface);border-radius:22px;padding:34px 22px;text-align:center}
.empty h3{margin:0 0 6px;font-size:1.3rem;font-weight:800}
.empty p{margin:0 auto 18px;color:var(--muted);max-width:34ch}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(39,43,34,.42);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:620px;max-height:92vh;max-height:92dvh;overflow:auto;border-radius:24px 24px 0 0;padding-top:8px;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));animation:up .18s ease-out}
@keyframes up{from{transform:translateY(28px);opacity:.6}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.tile{transition:none}}
.grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:2px auto 10px}
.sh{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.sh h2{flex:1;margin:0;font-weight:800;font-size:1.35rem}
.x{width:40px;height:40px;border-radius:12px;border:0;background:var(--surface);font-size:1.3rem;line-height:1;flex:none}
.x:disabled{opacity:.3}
.sb{display:flex;flex-direction:column;gap:14px}

.fld{display:flex;flex-direction:column;gap:5px;min-width:0;border:0;margin:0;padding:0}
.fld>span,.fld>legend{font-size:.85rem;font-weight:700;color:var(--muted);padding:0}
.fld input,.fld textarea{border:0;background:var(--surface);border-radius:12px;padding:12px 14px;min-height:48px;width:100%}
.fld textarea{min-height:90px;font-size:.75rem}
.fld input:focus,.fld textarea:focus{outline:2px solid var(--brand)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:end}
.hint{margin:0;color:var(--muted);font-size:.9rem}
.calc{margin:0;background:var(--sand);border-radius:12px;padding:12px 14px}
.err{margin:0;color:var(--bad);font-weight:700}
.wrn{color:var(--warn);font-weight:700}

/* suggestions */
.sugg{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.sg{border:0;border-radius:999px;background:var(--brand-soft);color:var(--brand-deep);padding:8px 14px;font-weight:600;min-height:38px}
.sg b{font-weight:800}

.choice{display:grid;grid-template-columns:1fr;gap:6px}
.choice label{background:var(--surface);border-radius:12px;padding:9px 12px;display:flex;flex-direction:column;gap:0;cursor:pointer;box-shadow:inset 0 0 0 2px transparent;line-height:1.3}
.choice label b{font-weight:800;font-size:.95rem}
.choice label small{color:var(--muted);font-size:.75rem}
.choice.picked label:not(:has(input:checked)){display:none}
.chg{align-self:flex-start;color:var(--brand)!important;margin-top:6px}
.steps{margin:-6px 0 0;font-size:.82rem;color:var(--muted)}
.steps b{color:var(--brand)}
.bought{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface);border-radius:12px;padding:10px 14px;font-size:.92rem}
#pf.wiz .ready-only{display:none}
#pf.wiz.none .sizes-only,#pf.wiz.none .single-only{display:none}
.choice label:has(input:checked){box-shadow:inset 0 0 0 2px var(--brand);background:var(--brand-soft)}
.choice input{position:absolute;opacity:0;pointer-events:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:0;border-radius:999px;background:var(--surface);padding:8px 16px;font-weight:700;min-height:40px}
.chip[aria-pressed="true"],.chip:has(input:checked){background:var(--brand);color:#fff}
.chip input{position:absolute;opacity:0;pointer-events:none}

.size{background:var(--surface);border-radius:14px;padding:10px;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr) minmax(0,.9fr) auto;gap:6px;align-items:end}
.size .fld input{background:var(--bg);min-height:44px;padding:10px}
.size .fld>span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.size .x{background:var(--bg);margin-bottom:2px}
.size .wt{grid-column:1/-1}
.size .sugg{grid-column:1/-1}
#pf.ready .bulk-only,#pf.bulk .ready-only,#pf.single .sizes-only,#pf:not(.single) .single-only{display:none}
.calc.bad{background:var(--bad-soft);color:var(--bad)}


.line{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.line small{display:block;color:var(--muted);font-size:.82rem}
.step{display:flex;align-items:center;gap:10px}
.step button{width:40px;height:40px;border-radius:12px;border:0;background:var(--surface);font-size:1.2rem;font-weight:800}
.step span,.step input{min-width:30px;text-align:center;font-weight:800}
.step input{width:62px;height:40px;border:0;border-radius:12px;background:var(--surface)}
.line .amt{font-weight:800;min-width:78px;text-align:right}
.total{display:flex;justify-content:space-between;align-items:baseline;font-weight:800;font-size:1.1rem}
.total b{font-size:1.8rem}
.pay{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pay.pay2{grid-template-columns:1fr 1fr}
.prow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:0}
.prow .pl{flex:1;min-width:0}
.prow .pl b{display:block;font-size:1.2rem;font-weight:800}
.prow .pl small{color:var(--muted);font-size:.88rem}
.prow .addb{min-width:84px}
.other-in{margin-top:8px;border:0;background:var(--surface);border-radius:12px;padding:12px 14px;min-height:48px;width:100%}
.other-in:focus{outline:2px solid var(--brand)}
.pay button{border:0;border-radius:14px;background:var(--surface);min-height:52px;font-weight:800;font-size:.98rem}
.pay button:active{background:var(--brand);color:#fff}
.pay .on{background:var(--brand);color:#fff}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:#fff;border-radius:16px;padding:10px 10px 10px 16px;display:flex;align-items:center;gap:12px;width:min(92vw,440px)}
#toast span{flex:1}
#toast button{border:0;border-radius:10px;background:var(--bg);color:var(--brand);font-weight:800;padding:8px 14px}
</style>
</head>

  m:'m',mt:'m',metre:'m',metres:'m',meter:'m',meters:'m',cm:'cm',pc:'pcs',pcs:'pcs',piece:'pcs',pieces:'pcs'};
function parseQty(t){
  t=String(t||'').toLowerCase().trim().replace(/,/g,'.').replace(/\s+/g,' ').replace(/\.$/,'');
  const m=t.match(/^(three quarters?|quarter|robo|half|nusu|¼|½|¾|[13]\/[24]|\d+(?:\.\d+)?|\.\d+)\s*(?:of\s*(?:a\s*)?)?([a-z]+)?$/);
  if(!m) return null;
  const n=FR[m[1]]??parseFloat(m[1]); if(!(n>0)) return null;
  if(!m[2]) return {n,u:null};
  return {n,u:UW[m[2]]||m[2]};
}
/* amount of the product's own unit that a size label stands for, or null */
function sizeIn(label,unit){
  const q=parseQty(label); if(!q) return null;
  if(!q.u) return (unit==='kg'||unit==='L')&&q.n>=50?q.n/1000:q.n;  /* "250" in a kg product means 250 g */
  if(unit==='kg') return q.u==='kg'?q.n:q.u==='g'?q.n/1000:null;
  if(unit==='L') return q.u==='L'?q.n:q.u==='ml'?q.n/1000:null;
  if(unit==='m') return q.u==='m'?q.n:q.u==='cm'?q.n/100:null;
  if(unit==='pcs') return q.u==='pcs'?q.n:null;
  const stem=uOne(unit).slice(0,4); return q.u.startsWith(stem)?q.n:null;
}
const FRS={0.25:'¼',0.5:'½',0.75:'¾'};
/* the app's standard way of writing a size */
function canon(v,unit){
  const r=Math.round(v*1000)/1000;
  if(unit==='kg'||unit==='L'||unit==='m'){
    if(FRS[r]) return FRS[r]+' '+unit;
    if(r<1) return Math.round(r*(unit==='m'?100:1000))+(unit==='kg'?' g':unit==='L'?' ml':' cm');
    return nf(r,2).replace(/,/g,'')+' '+unit;
  }
  if(unit==='pcs') return r===1?'1 piece':nf(r,2).replace(/,/g,'')+' pieces';
  return r===1?'1 '+uOne(unit):nf(r,2).replace(/,/g,'')+' '+unit;
}
const cap=x=>x?x.charAt(0).toUpperCase()+x.slice(1):x;
/* ready-to-sell sizes keep the unit people chose; only the writing is tidied */
function tidyReady(label){
  const t=String(label||'').trim().replace(/\s+/g,' '); if(!t) return t;
  const q=parseQty(t);
  if(q&&q.u&&['kg','g','L','ml','m','cm','pcs'].includes(q.u)){
    const r=Math.round(q.n*1000)/1000, f=(['kg','L','m'].includes(q.u)&&FRS[r])?FRS[r]:nf(r,2).replace(/,/g,'');
    if(q.u==='pcs') return r===1?'1 piece':f+' pieces';
    return f+' '+q.u;
  }
  return cap(t);
}
function tidySize(label,mode,unit){
  if(mode==='bulk'){const v=sizeIn(label,unit); if(v) return canon(v,unit);}
  return tidyReady(label);
}
/* suggestions while typing a size */
function sizeOptions(raw,mode,unit){
  const q=raw.trim().toLowerCase(), out=[]; const add=x=>{if(x&&!out.includes(x))out.push(x);};
  if(!q) return out;
  const pq=parseQty(q);
  if(mode==='bulk'){
    if(pq&&!pq.u&&(unit==='kg'||unit==='L')){ if(pq.n>=50){add(canon(pq.n/1000,unit));} else {add(canon(pq.n,unit)); if(pq.n>=10) add(canon(pq.n/1000,unit));} }
    else { const v=sizeIn(q,unit); if(v) add(canon(v,unit)); }
    [['quarter',.25],['robo',.25],['half',.5],['nusu',.5],['three',.75]].forEach(([w,v])=>{if(w.startsWith(q)&&q.length>=1&&!/^\d/.test(q)) add(canon(v,unit));});
    (SIZES[unit]||[1,2,5,10].map(n=>canon(n,unit))).filter(x=>x.toLowerCase().startsWith(q)).forEach(add);
  } else {
    if(pq&&!pq.u){ add(tidyReady(pq.n+' g')); add(tidyReady(pq.n+' ml')); if(pq.n<=5) add(tidyReady(pq.n+' kg')),add(tidyReady(pq.n+' L')); }
    else if(pq) add(tidyReady(q));
    SIZES.ready.filter(x=>x.toLowerCase().startsWith(q)).forEach(add);
    SIZES.ready.filter(x=>!x.toLowerCase().startsWith(q)&&x.toLowerCase().includes(q)).forEach(add);
  }
  return out;
}
function isoDay(t){const d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function tsFromIso(v){
  const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(v||''); if(!m) return null;
  if(v===isoDay(Date.now())) return Date.now();
  const t=new Date(+m[1],+m[2]-1,+m[3],12,0,0).getTime(); return t>Date.now()?null:t;
}
function buzz(){try{navigator.vibrate&&navigator.vibrate(10);}catch(e){}}

/* ---------- storage ---------- */
function blank(){return {v:2,shop:'',items:[],packs:[],sales:[],deliveries:[],repacks:[],debts:[],payments:[]};}
function load(){
  try{const raw=localStorage.getItem(KEY); if(raw){const d=JSON.parse(raw); if(d&&Array.isArray(d.items)){S=Object.assign(blank(),d);return;}}}catch(e){storageOk=false;}
  S=blank(); save();
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));storageOk=true;}catch(e){storageOk=false;}}
function commit(){save();render();}

/* ---------- suggestions ---------- */
function hl(x,q){const i=x.toLowerCase().indexOf(q); return i<0?esc(x):esc(x.slice(0,i))+'<b>'+esc(x.slice(i,i+q.length))+'</b>'+esc(x.slice(i+q.length));}
function suggest(input,source,onPick,after,smart){
  const box=document.createElement('div'); box.className='sugg'; box.hidden=true;
  (after||input).insertAdjacentElement('afterend',box);
  const show=()=>{
    const raw=input.value.trim(), q=raw.toLowerCase(); if(!q){box.hidden=true;return;}
    let res;
    if(smart) res=source(raw).filter(x=>x!==raw).slice(0,6);
    else {
      const list=[...new Set(source())];
      const a=list.filter(x=>x.toLowerCase().startsWith(q));
      const b=list.filter(x=>!a.includes(x)&&x.toLowerCase().split(/[\s(]+/).some(w=>w.startsWith(q)));
      res=[...a,...b].filter(x=>x.toLowerCase()!==q).slice(0,6);
    }
    box.innerHTML=res.map(x=>`<button type="button" class="sg" data-v="${esc(x)}">${hl(x,q)}</button>`).join('');
    box.hidden=!res.length;
  };
  input.addEventListener('input',show);
  input.addEventListener('blur',()=>setTimeout(()=>{box.hidden=true;},150));
  box.addEventListener('pointerdown',e=>e.preventDefault());
  box.addEventListener('click',e=>{const b=e.target.closest('.sg'); if(!b) return; input.value=b.dataset.v; box.hidden=true; if(onPick) onPick(b.dataset.v); input.dispatchEvent(new Event('input',{bubbles:true}));});
  return box;
}
const customers=()=>{const s=new Set(); S.sales.forEach(x=>x.customer&&s.add(x.customer)); S.debts.forEach(d=>s.add(d.customer)); S.payments.forEach(p=>s.add(p.customer)); return [...s];};

/* ---------- money owed ---------- */
function balances(){
  const b={}; const add=(c,v,t)=>{b[c]=b[c]||{owed:0,last:0,since:t};b[c].owed+=v;b[c].last=Math.max(b[c].last,t);};
  S.sales.forEach(s=>{if(s.pay==='deni') add(s.customer,s.total,s.ts);});
  S.debts.forEach(d=>add(d.customer,d.amount,d.ts));
  S.payments.forEach(p=>add(p.customer,-p.amount,p.ts));
  return b;
}

/* ---------- render ---------- */
function render(){
  $('#offline').hidden=navigator.onLine;
  document.querySelectorAll('nav.tabs [data-tab]').forEach(b=>{b.classList.toggle('on',b.dataset.tab===tab);b.setAttribute('aria-current',b.dataset.tab===tab?'page':'false');});
  $('#view').innerHTML=tab==='sell'?vSell():tab==='stock'?vStock():tab==='deni'?vDeni():vReport();
  if(tab==='sell'){const f=$('#find'); if(f) f.addEventListener('input',()=>{findQ=f.value;showN=PAGE;drawTiles();}); drawTiles();}
  if(tab==='stock'){const f=$('#sfind'); if(f) f.addEventListener('input',()=>{stockQ=f.value;stockN=PAGE;drawCards();}); drawCards();}
  cartBar();
}
function empty(h,p,btn,act){return `<div class="empty"><h3>${esc(h)}</h3><p>${esc(p)}</p>${btn?`<button class="btn primary" data-act="${act}">${esc(btn)}</button>`:''}</div>`;}
const fullName=(it,p)=>p&&p.label?it.name+' '+p.label:it.name;
const plab=p=>p.label||'Each';
const matches=(name,q)=>{const n=name.toLowerCase(); return n.includes(q)||n.split(/[\s(]+/).some(w=>w.startsWith(q));};

/* ---------- sell ---------- */
/* How often each product sold in the last 30 days. Sales in the last 7 days count double. */
function salesScore(){
  const now=Date.now(), from=now-30*DAY, wk=now-7*DAY, sc=new Map();
  for(const s of S.sales){
    if(s.ts<from) continue; const w=s.ts>=wk?2:1, seen=new Set();
    for(const l of s.lines){ if(seen.has(l.itemId)) continue; seen.add(l.itemId); sc.set(l.itemId,(sc.get(l.itemId)||0)+w); }
  }
  return sc;
}
function pickedCounts(){const m=new Map(); cart.forEach(c=>{if(c.k!=='pack') return; const p=pack(c.packId); if(p) m.set(p.itemId,(m.get(p.itemId)||0)+c.qty);}); return m;}
const cartQty=pid=>(cart.find(c=>c.k==='pack'&&c.packId===pid)||{qty:0}).qty;
function cartAdd(pid,d){
  if(d>0){
    const p=pack(pid), it=p&&item(p.itemId); if(!it) return false;
    if(p.stock<=0){
      toast(it.mode==='bulk'?`No ${p.label} packed yet. Repack ${it.name} in Stock first.`:`${fullName(it,p)} is out of stock. Record a delivery in Stock.`); return false;
    }
    if(cartQty(pid)+d>p.stock){toast(`Only ${p.stock} ${fullName(it,p)} in stock.`); return false;}
  }
  const i=cart.findIndex(c=>c.k==='pack'&&c.packId===pid);
  if(i<0){ if(d>0) cart.push({k:'pack',packId:pid,qty:d}); }
  else { cart[i].qty+=d; if(cart[i].qty<=0) cart.splice(i,1); }
  buzz();
}
function vSell(){
  if(!S.packs.length) return `<div class="vh"><h2>Sell</h2></div>`+empty('Your shop is empty','Add the things you sell, one at a time. Start with something you sell every day, like sugar.','+ Add a product','product');
  return `<div class="vh"><h2>Sell</h2>${S.sales.length?'<button class="btn line" data-act="sales">Recent sales</button>':''}</div>
    <div class="find"><input id="find" type="search" placeholder="Search ${S.items.length} products" value="${esc(findQ)}" autocomplete="off" aria-label="Search products"></div>
    <div id="tiles-wrap"></div>`;
}
function drawTiles(){
  const wrap=$('#tiles-wrap'); if(!wrap) return;
  const q=findQ.trim().toLowerCase(), sc=salesScore(), picked=pickedCounts();
  let list=S.items.filter(i=>packsOf(i.id).length);
  if(q) list=list.filter(i=>matches(i.name,q));
  const starts=i=>q&&i.name.toLowerCase().startsWith(q)?1:0;
  list.sort((a,b)=>starts(b)-starts(a)||(sc.get(b.id)||0)-(sc.get(a.id)||0)||a.name.localeCompare(b.name));
  if(!list.length){wrap.innerHTML=`<p class="nomatch">Nothing matches “${esc(findQ.trim())}”.<br><button class="btn soft" data-act="product" style="margin-top:10px">+ Add it as a product</button></p>`;return;}
  const shown=list.slice(0,showN);
  wrap.innerHTML=`${!q&&sc.size?'<p class="hint sm">Your best sellers are first</p>':''}<div class="tiles">${shown.map(i=>tileHTML(i,picked.get(i.id)||0)).join('')}</div>`+
    (list.length>shown.length?`<button class="btn line wide more" data-act="more" data-w="sell">Show more <span class="muted">(${list.length-shown.length} more)</span></button>`:'');
}
/* "Ksh 40–160" fits on one line; very wide ranges become "From Ksh 1,200" */
function priceRange(lo,hi){ if(lo===hi) return ksh(lo); const r=ksh(lo)+'–'+Math.round(hi).toLocaleString('en-KE'); return r.length>13?'From '+ksh(lo):r; }
function tileHTML(it,n){
  const ps=packsOf(it.id), pr=ps.map(p=>p.price), lo=Math.min(...pr), hi=Math.max(...pr);
  const out=ps.every(p=>p.stock<=0), one=ps.length===1, few=!out&&one&&ps[0].stock<=3;
  return `<button class="tile${n?' picked':''}${out?' soldout':''}" data-act="pick" data-id="${it.id}" aria-label="${esc(it.name)}${out?', sold out':''}${n?', '+n+' in this sale':''}">
    <span class="t-name">${esc(it.name)}</span>
    <span class="t-sub">${one?esc(ps[0].label):ps.length+' sizes'}</span>
    <span class="t-foot"><span class="t-price">${priceRange(lo,hi)}</span>${out?'<span class="t-flag out">Sold out</span>':few?`<span class="t-flag">${ps[0].stock} left</span>`:''}</span>
    ${n?`<span class="t-n">${n}</span>`:''}</button>`;
}
/* products with several sizes open this list */
function openPicker(id){const it=item(id); openSheet('picker',it.name,pickerHTML(id)); sheet.dataset.item=id;}
function pickerHTML(id){
  return `<div class="panel">${packsOf(id).map(p=>{const n=cartQty(p.id);
    const out=p.stock<=0;
    return `<div class="prow${out?' soldout':''}"><div class="pl"><b>${esc(plab(p))}</b><small>${ksh(p.price)} · ${out?'<span class="down">sold out</span>':p.stock+' left'}</small></div>
      ${n?`<div class="step"><button data-act="pk" data-d="-1" data-id="${p.id}" aria-label="One less ${esc(plab(p))}">−</button><span>${n}</span><button data-act="pk" data-d="1" data-id="${p.id}" aria-label="One more ${esc(plab(p))}" ${n>=p.stock?'disabled':''}>+</button></div>`
         :out?'<span class="muted" style="font-size:.88rem">Sold out</span>':`<button class="btn soft addb" data-act="pk" data-d="1" data-id="${p.id}">Add</button>`}</div>`;}).join('')}</div>
    <button class="btn primary wide" data-act="close">Done</button>`;
}

/* ---------- stock ---------- */
function stockStates(){
  const low=new Set(lowList().map(r=>r.itemId)), st=new Map();
  S.items.forEach(it=>{const ps=packsOf(it.id); const allOut=ps.length&&ps.every(p=>p.stock<=0)&&!(it.mode==='bulk'&&it.bulk>0); st.set(it.id,allOut?'out':low.has(it.id)?'low':'ok');});
  return st;
}
const itemWorth=it=>(it.mode==='bulk'?Math.max(0,it.bulk)*(it.cost||0):0)+packsOf(it.id).reduce((a,p)=>a+Math.max(0,p.stock)*(p.cost||0),0);
const initials=n=>{const w=n.replace(/\(.*?\)/g,'').trim().split(/\s+/);return (w.length>1?w[0][0]+w[1][0]:w[0].slice(0,2)).toUpperCase();};
function vStock(){
  let h=`<div class="vh"><h2>Stock</h2>${S.items.length?'<button class="btn soft" data-act="delivery">Delivery</button>':''}<button class="btn primary" data-act="product">+ Add</button></div>`;
  if(!S.items.length) return h+empty('Nothing here yet','Add each product once with its sizes and prices. After that, record deliveries as they come in.','+ Add a product','product');
  const st=stockStates(); let nOut=0,nLow=0; st.forEach(v=>{if(v==='out')nOut++;else if(v==='low')nLow++;});
  const worth=S.items.reduce((a,i)=>a+itemWorth(i),0);
  h+=`<div class="stats"><div><span class="l">Products</span><b>${S.items.length.toLocaleString('en-KE')}</b></div><div><span class="l">Stock worth</span><b>${ksh(worth)}</b></div><div><span class="l">Need attention</span><b class="${nOut+nLow?'wrn':''}">${nOut+nLow}</b></div></div>`;
  if(S.items.length>6) h+=`<div class="find" style="margin:12px 0 0"><input id="sfind" type="search" placeholder="Search stock" value="${esc(stockQ)}" autocomplete="off" aria-label="Search stock"></div>`;
  if(nOut+nLow) h+=`<div class="seg" style="margin:12px 0 0" role="group" aria-label="Show">${[['all','All'],['low','Running low ('+nLow+')'],['out','Out ('+nOut+')']].map(([k,l])=>`<button data-act="sfilter" data-f="${k}" aria-pressed="${stockFilter===k}">${l}</button>`).join('')}</div>`;
  return h+`<div id="cards-wrap"></div>`;
}
function drawCards(){
  const wrap=$('#cards-wrap'); if(!wrap) return;
  const st=stockStates(), q=stockQ.trim().toLowerCase(), rank={out:0,low:1,ok:2};
  let list=S.items.filter(i=>(stockFilter==='all'||st.get(i.id)===stockFilter)&&(!q||matches(i.name,q)));
  list.sort((a,b)=>rank[st.get(a.id)]-rank[st.get(b.id)]||a.name.localeCompare(b.name));
  if(!list.length){wrap.innerHTML=`<p class="nomatch">Nothing here.</p>`;return;}
  const shown=list.slice(0,stockN);
  wrap.innerHTML=`<div class="cards">`+shown.map(it=>{
    const s2=st.get(it.id), ps=packsOf(it.id);
    let meter='';
    if(it.mode==='bulk'){
      const ref=Math.max(1,it.bulk,it.ref||0,...S.deliveries.filter(d=>d.itemId===it.id&&!d.packId).map(d=>d.qty)), pct=Math.max(0,Math.min(100,it.bulk/ref*100));
      meter=`<div class="sack"><div class="sack-top"><span>Bulk, not yet packed</span><b>${qty(it.bulk,it.unit)}</b></div><div class="meter"><i style="width:${pct.toFixed(0)}%" class="${it.bulk<=0?'out':s2==='low'?'low':''}"></i></div></div>`;
    }
    const pk=ps.reduce((a,p)=>a+Math.max(0,p.stock),0);
    const side=it.mode==='bulk'?`${pk} packed`:`${pk} in stock`;
    return `<button class="card" data-act="item" data-id="${it.id}">
      <div class="c-top"><span class="c-name"><b>${esc(it.name)}${s2==='out'?' <span class="flag out">Out</span>':s2==='low'?' <span class="flag">Low</span>':''}</b><small>${it.mode==='bulk'?'Needs repackaging · '+esc(uName(it.unit)):'Ready to sell'}</small></span>
        <span class="c-side"><b>${ksh(itemWorth(it))}</b><small>${side}</small></span><span class="chev">›</span></div>
      <div class="szs">${it.mode==='bulk'?`<span class="sz bulkc ${it.bulk<=0?'out':''}"><span>Bulk</span><b>${qty(it.bulk,it.unit)}</b></span>`:''}${ps.map(p=>`<span class="sz ${p.stock<=0?'out':''}"><span>${esc(p.label||'In stock')}</span><b>${p.stock}</b></span>`).join('')}</div>
    </button>`;}).join('')+`</div>`+
    (list.length>shown.length?`<button class="btn line wide more" data-act="more" data-w="stock">Show more <span class="muted">(${list.length-shown.length} more)</span></button>`:'');

/* ---------- debt ---------- */
function vDeni(){
  const ent=Object.entries(balances()).filter(([,v])=>v.owed>0.5).sort((a,b)=>b[1].owed-a[1].owed);
  let h=`<div class="vh"><h2>Debt</h2><button class="btn primary" data-act="add-debt">+ Add debt</button></div>`;
  if(!ent.length) return h+empty('Nobody owes you','When someone takes goods on credit, choose Debt when you finish the sale, or tap + Add debt.','','');
  const tot=ent.reduce((a,[,v])=>a+v.owed,0);
  return h+`<div class="big" style="margin-top:0"><div class="l">Owed to you</div><div class="v">${ksh(tot)}</div><div class="s">${ent.length} ${ent.length===1?'person':'people'}</div></div>
    <div class="panel" style="margin-top:12px">`+ent.map(([c,v])=>`<div class="row"><button class="main" style="border:0;background:none;text-align:left;padding:0" data-act="person" data-c="${esc(c)}"><b>${esc(c)}</b><small>${ksh(v.owed)} · last ${day(v.last)}</small></button><button class="btn primary" data-act="paid" data-c="${esc(c)}">Settle</button></div>`).join('')+`</div>`;
}

function vReport(){
  const now=Date.now(), td=sod(now), days=period==='today'?1:period==='week'?7:30, from=td-(days-1)*DAY;
  const seg=`<div class="seg" role="group" aria-label="Period">${[['today','Today'],['week','7 days'],['month','30 days']].map(([k,l])=>`<button data-act="period" data-p="${k}" aria-pressed="${period===k}">${l}</button>`).join('')}</div>`;
  let h=`<div class="vh"><h2>Report</h2></div>`+seg;
  if(!S.sales.length) return h+`<div style="margin-top:12px">`+empty('No sales yet','Your money in, profit and best sellers show here once you start selling.','','')+`</div>`;
  const ss=S.sales.filter(s=>s.ts>=from), rev=ss.reduce((a,s)=>a+s.total,0), prof=rev-ss.reduce((a,s)=>a+s.cost,0);
  const pTo=period==='today'?now-DAY:from, prev=S.sales.filter(s=>s.ts>=from-days*DAY&&s.ts<pTo).reduce((a,s)=>a+s.total,0);
  const dl=prev>0?Math.round((rev-prev)/prev*100):null;
  const cmp=period==='today'?'than this time yesterday':period==='week'?'than the week before':'than the month before';
  /* money actually received: cash and M-Pesa from sales, plus debts paid back */
  const got=(a,b)=>{const r={cash:0,mpesa:0,back:0}; S.sales.forEach(x=>{if(x.ts>=a&&x.ts<b&&(x.pay==='cash'||x.pay==='mpesa'))r[x.pay]+=x.total;});
    S.payments.forEach(p=>{if(p.ts>=a&&p.ts<b){r[p.method==='mpesa'?'mpesa':'cash']+=p.amount; r.back+=p.amount;}}); r.total=r.cash+r.mpesa; return r;};
  const gNow=got(from,Infinity), gPrev=got(from-days*DAY,pTo), onDebt=ss.filter(x=>x.pay==='deni').reduce((a,x)=>a+x.total,0);
  const dg=gPrev.total>0?Math.round((gNow.total-gPrev.total)/gPrev.total*100):null;
  h+=`<div class="big"><div class="l">Money in</div><div class="v">${ksh(gNow.total)}</div><div class="s">${dg===null?(period==='today'?'Today so far':'This period'):`<span class="${dg>=0?'up':'down'}">${Math.abs(dg)}% ${dg>=0?'more':'less'}</span> ${cmp}`}</div>
    <div class="split2"><div><span>Cash</span><b>${ksh(gNow.cash)}</b></div><div><span>M-Pesa</span><b>${ksh(gNow.mpesa)}</b></div></div>
    ${gNow.back||onDebt?`<div class="s" style="margin-top:8px">${gNow.back?`Includes ${ksh(gNow.back)} of debts paid back.`:''}${gNow.back&&onDebt?' ':''}${onDebt?`${ksh(onDebt)} more was sold on debt.`:''}</div>`:''}</div>
    <div class="pair"><div><div class="l">Profit</div><div class="v">${ksh(prof)}</div></div><div><div class="l">Customers</div><div class="v">${ss.length}</div></div></div>`;
  const bp={cash:0,mpesa:0,deni:0}; ss.forEach(s=>bp[s.pay]+=s.total);
  const pays=S.payments.filter(p=>p.ts>=from);
  if(pays.length){const pm={cash:0,mpesa:0,other:0}; pays.forEach(p=>pm[p.method==='cash'||p.method==='mpesa'?p.method:'other']+=p.amount);
    h+=`<p class="sec">Debts paid back</p><div class="panel"><div class="kv"><span>Cash</span><span>${ksh(pm.cash)}</span></div><div class="kv"><span>M-Pesa</span><span>${ksh(pm.mpesa)}</span></div>${pm.other?`<div class="kv"><span>Not recorded</span><span>${ksh(pm.other)}</span></div>`:''}</div>`;}
  h+=`<p class="sec">Last 7 days</p><div class="chart">${chart()}</div>`;
  const top={}; ss.forEach(s=>s.lines.forEach(l=>{const t=top[l.name]=top[l.name]||{n:0,r:0};t.n+=l.qty;t.r+=l.price;}));
  const tl=Object.entries(top).sort((a,b)=>b[1].r-a[1].r).slice(0,5);
  if(tl.length) h+=`<p class="sec">Best sellers</p><div class="panel">${tl.map(([n,t])=>`<div class="kv"><span>${esc(n)} <span style="color:var(--muted);font-weight:600">× ${t.n}</span></span><span>${ksh(t.r)}</span></div>`).join('')}</div>`;
  const low=lowList();
  if(low.length) h+=`<p class="sec">Running low</p><div class="panel">${low.map(r=>`<div class="kv"><span>${esc(r.name)}</span><span class="${r.out?'down':'wrn'}">${esc(r.text)}</span></div>`).join('')}</div>`;
  const owed=Object.values(balances()).reduce((a,b)=>a+Math.max(0,b.owed),0);
  if(owed>0.5) h+=`<p class="sec">Debt</p><div class="panel"><button class="row" data-act="tab" data-tab="deni"><span class="main"><b>${ksh(owed)} owed to you</b></span><span class="chev">›</span></button></div>`;
  return h;
}
function chart(){
  const td=sod(Date.now()), v=[];
  for(let i=6;i>=0;i--){const ds=td-i*DAY; v.push({ds,x:S.sales.filter(s=>s.ts>=ds&&s.ts<ds+DAY).reduce((a,s)=>a+s.total,0)});}
  const W=700,H=220,pt=30,pb=34,ih=H-pt-pb,max=Math.max(1,...v.map(d=>d.x)),bw=W/7,g=18;
  let o=`<line x1="0" x2="${W}" y1="${H-pb}" y2="${H-pb}" stroke="#E2DED0" stroke-width="2"/>`;
  v.forEach((d,i)=>{
    const h=d.x/max*ih, X=i*bw+g/2, Y=H-pb-h, now=d.ds===td, k=d.x>=1000?(d.x/1000).toFixed(d.x>=10000?0:1).replace(/\.0$/,'')+'k':String(Math.round(d.x));
    o+=`<rect x="${X.toFixed(1)}" y="${Y.toFixed(1)}" width="${(bw-g).toFixed(1)}" height="${h.toFixed(1)}" rx="8" fill="${now?'#0B3D91':'#D9DFEC'}"/>`;
    if(d.x>0) o+=`<text x="${(X+(bw-g)/2).toFixed(1)}" y="${(Y-9).toFixed(1)}" text-anchor="middle" font-size="20" font-weight="${now?800:600}" fill="#18213A" font-family="Nunito, system-ui, sans-serif">${k}</text>`;
    o+=`<text x="${(X+(bw-g)/2).toFixed(1)}" y="${H-8}" text-anchor="middle" font-size="19" font-weight="${now?800:600}" fill="${now?'#0B3D91':'#5E6577'}" font-family="Nunito, system-ui, sans-serif">${now?'Today':new Date(d.ds).toLocaleDateString('en-GB',{weekday:'short'})}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Money in for each of the last 7 days">${o}</svg>`;
}
function lowList(){
  const from=Date.now()-7*DAY, sold={}, out={}, rows=[];
  S.sales.filter(s=>s.ts>=from).forEach(s=>s.lines.forEach(l=>{if(l.k==='pack')sold[l.packId]=(sold[l.packId]||0)+l.qty;else out[l.itemId]=(out[l.itemId]||0)+l.units;}));
  S.repacks.filter(r=>r.ts>=from).forEach(r=>out[r.itemId]=(out[r.itemId]||0)+r.used);
  S.items.forEach(it=>{
    if(it.mode==='bulk'&&out[it.id]){const d=it.bulk/(out[it.id]/7); if(d<3) rows.push({itemId:it.id,name:it.name+' (bulk)',text:it.bulk<=0?'Empty':qty(it.bulk,it.unit)+' left',out:it.bulk<=0,d});}
    packsOf(it.id).forEach(p=>{
      if(!sold[p.id]&&p.stock>0) return;
      const d=sold[p.id]?p.stock/(sold[p.id]/7):0;
      if(p.stock<=0||d<2) rows.push({itemId:it.id,name:fullName(it,p),text:p.stock<=0?'Out':p.stock+' left',out:p.stock<=0,d});
    });
  });
  return rows.sort((a,b)=>a.d-b.d);
}

function applySale(s,sign){s.lines.forEach(l=>{if(l.k==='pack'){const p=pack(l.packId); if(p)p.stock+=sign*l.qty;}else{const it=item(l.itemId); if(it)it.bulk=r3(it.bulk+sign*l.units);}});}
function sell(pay,customer){
  const lines=cart.map(c=>{
    if(c.k==='pack'){const p=pack(c.packId),it=item(p.itemId);return {k:'pack',packId:p.id,itemId:it.id,name:fullName(it,p),qty:c.qty,units:r3(p.size*c.qty),price:p.price*c.qty,cost:(p.cost||0)*c.qty};}
    const it=item(c.itemId);return {k:'loose',itemId:it.id,name:it.name+' (loose)',qty:1,units:c.units,price:c.amount,cost:(it.cost||0)*c.units};
  });
  const s={id:uid(),ts:Date.now(),lines,total:lines.reduce((a,l)=>a+l.price,0),cost:lines.reduce((a,l)=>a+l.cost,0),pay,customer:customer||''};
  applySale(s,-1); S.sales.push(s); cart=[]; findQ=''; lastSale=s.id; closeSheet(); commit();
  toast(`Sold ${ksh(s.total)}${pay==='deni'?' to '+customer+' as debt':pay==='mpesa'?' by M-Pesa':''}`,true);
}
function undo(){const i=S.sales.findIndex(s=>s.id===lastSale); if(i<0) return; applySale(S.sales[i],+1); S.sales.splice(i,1); lastSale=null; commit(); toast('Sale removed');}
function toast(m,u){const t=$('#toast'); t.innerHTML=`<span>${esc(m)}</span>${u?'<button data-act="undo">Undo</button>':''}`; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>{t.hidden=true;if(u)lastSale=null;},u?8000:3000);}

function pfModeVal(){const f=$('#pf'); const r=f.querySelector('input[name="pf-mode"]:checked'); return r?r.value:(f.classList.contains('bulk')?'bulk':f.classList.contains('single')?'single':'sizes');}

function pfUnitVal(){

function pfMode(){

  ['bulk','single','sizes','ready'].forEach(c=>f.classList.remove(c)); f.classList.add(m); if(m!=='bulk') f.classList.add('ready');

/* live check: buying cost per unit, and packed sizes can't add up to more than was bought */
function pfCheck(){
  const f=$('#pf'); if(!f) return; if(f.classList.contains('wiz')) return awCheck(); const calc=f.querySelector('#pf-calc'), pk=f.querySelector('#pf-pack');

function pfSave(it){
  const f=$('#pf'), err=f.querySelector('#pf-err'), fail=m=>{err.textContent=m;err.hidden=false;err.scrollIntoView({block:'nearest'});};
  const fm=pfModeVal(), mode=fm==='bulk'?'bulk':'ready', unit=it?it.unit:(mode==='bulk'?pfUnitVal():'pc');
  const name=f.querySelector('#pf-name').value.trim();
  if(!name) return fail('Give the product a name.');
  const dup=byName(name); if(dup&&(!it||dup.id!==it.id)) return fail(`${name} is already in your shop.`);
  if(mode==='bulk'&&!unit) return fail('Write what the bulk is counted in, like bundles.');
  let rows;
  if(fm==='single'){
    const old=it?packsOf(it.id)[0]:null;
    rows=[{pid:old?old.id:'',label:'',price:toNum(f.querySelector('#pf-s-price').value),stock:toNum(f.querySelector('#pf-s-stock').value),size:1,cost:toNum(f.querySelector('#pf-s-cost').value)}];
    if(!(rows[0].price>0)) return fail('Set the selling price.');
  } else {
    rows=[...f.querySelectorAll('.size')].map(r=>({pid:r.dataset.pid,label:tidySize(r.querySelector('.s-label').value,mode,unit),price:toNum(r.querySelector('.s-price').value),stock:toNum(r.querySelector('.s-stock').value),size:toNum(r.querySelector('.s-size').value),cost:toNum(r.querySelector('.s-cost').value)})).filter(r=>r.label||r.price>0||r.pid);
    if(!rows.length) return fail('Add at least one size you sell, like ¼ kg or 500 ml.');
    const seen=new Set();
    for(const r of rows){
      if(!r.label) return fail('Every size needs a name, like ¼ kg or 500 ml.');
      if(seen.has(r.label.toLowerCase())) return fail(`${r.label} is listed twice.`); seen.add(r.label.toLowerCase());
      if(!(r.price>0)) return fail(`Set a selling price for ${r.label}.`);
      if(mode==='bulk'){ const v=sizeIn(r.label,unit); if(v) r.size=v; if(!(r.size>0)) return fail(`How many ${uName(unit)} is ${r.label}? Write it under the size.`); }
    }
  }
  const paid=toNum(f.querySelector('#pf-paid')?.value), amt=toNum(f.querySelector('#pf-for')?.value);
  let bulkNow=null, costNow=null;
  if(mode==='bulk'){
    if(paid>0&&!(amt>0)) return fail(`Write how many ${uName(unit)} the Ksh ${Math.round(paid).toLocaleString('en-KE')} paid for.`);
    if(paid>0&&amt>0) costNow=paid/amt;
    if(!it){
      const packed=r3(rows.reduce((a,r)=>a+r.size*(r.stock>0?Math.floor(r.stock):0),0));
      if(packed>0&&!(amt>0)) return fail('Write how much you bought, so the packs come out of it.');
      if(packed>(amt||0)+1e-9) return fail(`The packs add up to ${qty(packed,unit)}, more than the ${qty(amt,unit)} you bought.`);
      bulkNow=r3((amt||0)-packed);
    } else {
      const b=toNum(f.querySelector('#pf-bulk').value); if(b>=0) bulkNow=r3(b);
    }
  }
  let t=it;
  if(!t){t={id:uid(),name,mode,unit,bulk:0,cost:0,added:Date.now()};S.items.push(t);if(mode==='bulk'&&amt>0)t.ref=amt;}
  t.name=name;
  const costChanged=mode==='bulk'&&costNow!==null&&Math.abs(costNow-(t.cost||0))>1e-9;
  if(mode==='bulk'){ if(bulkNow!==null) t.bulk=bulkNow; if(costNow!==null) t.cost=costNow; }
  if(!it&&mode==='bulk'&&amt>0) S.deliveries.push({id:uid(),ts:Date.now(),itemId:t.id,packId:null,qty:amt,paid:paid>0?paid:0});
  const keep=new Set();
  rows.forEach(r=>{
    const size=mode==='bulk'?r.size:1; let p=r.pid&&pack(r.pid);
    if(!p){p={id:uid(),itemId:t.id,label:'',size,price:0,stock:0,cost:0};S.packs.push(p);}
    p.label=r.label; p.size=size; p.price=r.price; if(r.stock>=0) p.stock=Math.floor(r.stock);
    if(mode==='bulk'){ if(t.cost>0&&(costChanged||!p.cost||!r.pid)) p.cost=t.cost*size; } else if(r.cost>=0) p.cost=r.cost;
    keep.add(p.id);
  });
  S.packs=S.packs.filter(p=>p.itemId!==t.id||keep.has(p.id));
  closeSheet(); commit(); toast(it?`Saved ${name}`:`${name} added`);
}

/* ---------- read a photo of the packet ----------
   The text is read on the phone by Tesseract.js. It downloads once (needs internet the first time),
   then the app picks out a product name, size and count for the shopkeeper to check. */
const OCR_SRC='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
function loadScript(src){return new Promise((ok,no)=>{if(window.Tesseract) return ok(); const el=document.createElement('script'); el.src=src; el.onload=()=>ok(); el.onerror=()=>no(new Error('load')); document.head.appendChild(el);});}
function shrinkImage(file,max){
  return new Promise((ok,no)=>{const url=URL.createObjectURL(file), img=new Image();
    img.onload=()=>{const k=Math.min(1,max/Math.max(img.width,img.height)), c=document.createElement('canvas'); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height); ok({canvas:c,url});};
    img.onerror=()=>no(new Error('image')); img.src=url;});
}
const OCR_SKIP=/^(net|wt|weight|ingredients?|made|in|kenya|ltd|limited|www|com|co|ke|best|before|exp|expiry|mfg|batch|price|kes|ksh|store|keep|cool|dry|place|product|of|the|and|for|with|new|per|kg|kgs|g|gm|gms|ml|mls|l|ltr|ltrs|litre|litres|x|pcs|pieces|bottles|sachets|packets|rolls|bars|pack)$/i;
/* picks out likely names, sizes and a count from the text found on a packet */
function parsePacket(text,lines){
  const t=String(text||'').replace(/\s+/g,' '), low=' '+t.toLowerCase().replace(/[^a-z0-9 ]/g,' ')+' ';
  const sizes=[]; const re=/(\d+(?:[.,]\d+)?)\s?(kg|kgs|g|gm|gms|grams?|ml|mls|l|ltrs?|litres?|liters?)(?![a-z])/gi; let m;
  while((m=re.exec(t))){const n=m[1].replace(',','.'); if(+n<=0||+n>5000) continue; const sz=tidyReady(n+' '+m[2]); if(parseQty(sz)&&!sizes.includes(sz)) sizes.push(sz);}
  const cm=t.match(/\b(\d{1,3})\s?(?:x|×|pcs|pieces|pc|sachets|bars|bottles|rolls|packets)(?![a-z])/i)||t.match(/(?:pack of|×|x)\s?(\d{1,3})\b/i);
  const count=cm&&+cm[1]>1?+cm[1]:null;
  const cat=CATALOG.map(c=>c[0]).filter(n=>{const k=n.replace(/\(.*?\)/g,'').trim().toLowerCase(); const base=k.replace(/s$/,''); return low.includes(' '+k+' ')||low.includes(' '+base+' ')||low.includes(' '+base+'s ');})
    .sort((a,b)=>b.length-a.length);
  let ls=(lines&&lines.length?lines.map(l=>({t:l.text,h:l.bbox?l.bbox.y1-l.bbox.y0:0})):String(text||'').split('\n').map(x=>({t:x,h:x.length})));
  const titles=[];
  ls.sort((a,b)=>b.h-a.h).forEach(l=>{
    const w=String(l.t).replace(/[^A-Za-z\s'&-]/g,' ').split(/\s+/).filter(x=>x.length>1&&!OCR_SKIP.test(x));
    const nm=w.slice(0,4).join(' '); if(nm.length>=3&&nm.length<=30){const c=nm.toLowerCase().replace(/\b\w/g,ch=>ch.toUpperCase()); if(!titles.includes(c)) titles.push(c);}
  });
  return {cat:cat.slice(0,3),titles:titles.slice(0,3),sizes:sizes.slice(0,3),count};
}
async function awReadPhoto(file){
  const f=$('#aw1'); if(!f) return; const res=f.querySelector('#aw-photo-res'), btn=f.querySelector('[data-act="aw-photo"]');
  res.hidden=false; res.classList.remove('bad'); res.innerHTML='Reading the packet… this can take a few seconds.'; btn.disabled=true;
  try{
    if(!window.Tesseract){ if(!navigator.onLine) throw new Error('offline'); await loadScript(OCR_SRC); }
    const {canvas,url}=await shrinkImage(file,1600);
    const worker=await window.Tesseract.createWorker('eng');
    const out=await worker.recognize(canvas); await worker.terminate();
    const d=out&&out.data||{}, r=parsePacket(d.text,d.lines);
    if(!$('#aw1')) return;
    awShowPhoto(r,url);
  }catch(e){
    res.classList.add('bad');
    res.innerHTML=e&&e.message==='offline'?'Reading a photo needs internet the first time. Type the details instead, or try again when you have data.':'The photo could not be read. Try again with the words on the packet clear and filling the picture, or type the details.';
  }finally{ const b2=$('#aw1 [data-act="aw-photo"]'); if(b2) b2.disabled=false; }
}
function awShowPhoto(r,url){

  const best=r.cat[0]||r.titles[0];

    done.push(`name <b>${esc(best)}</b>`);

  const isBulk=r.cat[0]&&CATALOG.find(c=>c[0]===r.cat[0])[1]==='bulk', u0=awUnitVal(), v0=r.sizes.length?sizeIn(r.sizes[0],u0):null;
  /* a big size (a sack or jerrycan, 10 kg / 10 L or more) is how much was bought; a small one is a ready packet */
  if(isBulk&&v0&&(v0>=10||!['kg','L'].includes(u0))){
    if(!f.querySelector('#aw-amt').value){ f.querySelector('#aw-amt').value=r3(v0); done.push(`amount <b>${esc(qty(v0,u0))}</b>`); }
  } else if(r.sizes.length){ AW.sizes=r.sizes.slice(); AW.how='sizes'; const pc=f.querySelector('input[name="aw-unit"][value="pcs"]'); if(pc) pc.checked=true; done.push(`size <b>${esc(r.sizes.join(', '))}</b>`); }
  if(r.count&&!f.querySelector('#aw-amt').value){ f.querySelector('#aw-amt').value=r.count; done.push(`amount <b>${r.count}</b>`); }
  awUnits();
  const others=[...r.cat,...r.titles].filter(x=>x!==name.value.trim()).filter((x,i,a)=>a.indexOf(x)===i).slice(0,4);
  res.hidden=false; res.classList.remove('bad');
  res.innerHTML=`<div class="pr-top">${url?`<img src="${url}" alt="Photo of the packet">`:''}<div>${done.length?`Filled in ${done.join(', ')}. <b>Check them before you go on.</b>`:'Nothing clear could be read. Type the details, or try a closer photo.'}</div></div>`+
    (others.length?`<div class="chips" style="margin-top:8px"><span class="hint sm" style="align-self:center;margin:0">Or use:</span>${others.map(x=>`<button type="button" class="chip" data-act="aw-photo-name" data-v="${esc(x)}">${esc(x)}</button>`).join('')}</div>`:'');
}

      <label class="fld"><span>Selling price, per ${esc(uOne(u))}</span><input id="pf-s-price" type="number" inputmode="decimal" min="0" step="any" placeholder="Ksh"></label>
      <p class="hint" style="align-self:end;margin:0 0 12px">${pcs?`${nf(Math.floor(AW.amt),0)} go on the shelf.`:`${qty(Math.floor(AW.amt),u)} go on the shelf as ${canon(1,u)} each.`}</p>
    </div>
    <p class="hint sizes-only" style="font-weight:700;margin-bottom:-6px">Sizes and prices</p>
    <div class="sb sizes-only" id="pf-sizes">${rows}</div>
    <button type="button" class="btn line sizes-only" data-act="size-add">+ Another size</button>
    <p class="calc" id="pf-calc" hidden></p>
    <p class="calc" id="pf-pack" hidden></p>
    <p class="err" id="pf-err" hidden></p>
    <button class="btn primary wide" type="submit" ${AW.how?'':'disabled'}>Add to my shop</button>
    <button type="button" class="btn line wide" data-act="aw-back">Back</button>
  </form>`,b=>{
    const f=b.querySelector('#pf');
    f.addEventListener('change',e=>{if(e.target.name==='pf-mode'){AW.how=e.target.value; awReshape(); }});
    f.addEventListener('input',pfCheck);

/* after choosing how it is sold, hide the other choices and show the right boxes */
function awReshape(){
  const f=$('#pf'); f.querySelector('.choice').classList.add('picked'); f.querySelector('.chg').hidden=false; f.classList.remove('none');
  f.querySelector('button[type=submit]').disabled=false;
  const kind=AW.how==='sizes'?'ready':'bulk', box=f.querySelector('#pf-sizes');
  const keep=[...box.querySelectorAll('.size')].map(r=>({label:r.querySelector('.s-label').value,price:r.querySelector('.s-price').value,stock:r.querySelector('.s-stock').value}));
  box.innerHTML=keep.map(p=>sizeRow({label:p.label,price:p.price===''?undefined:p.price,stock:p.stock===''?undefined:p.stock},kind,AW.unit,true)).join('');
  box.querySelectorAll('.size').forEach(wireSize);
  pfMode(); const first=AW.how==='single'?f.querySelector('#pf-s-price'):f.querySelector('.s-label'); if(first&&!first.value) setTimeout(()=>first.focus(),30);
}
/* live checks for step 2: cost of each pack, and nothing adds up to more than was bought */
function awCheck(){
  const f=$('#pf'), calc=f.querySelector('#pf-calc'), pk=f.querySelector('#pf-pack'), u=AW.unit, per=AW.paid>0?AW.paid/AW.amt:0;
  calc.hidden=true; pk.hidden=true; pk.classList.remove('bad');
  if(AW.how==='bulk'){
    const rows=[...f.querySelectorAll('.size')].map(r=>({label:r.querySelector('.s-label').value.trim(),size:sizeIn(r.querySelector('.s-label').value,u)||toNum(r.querySelector('.s-size').value),n:toNum(r.querySelector('.s-stock').value)||0})).filter(r=>r.label&&r.size>0);
    if(per&&rows.length){calc.innerHTML=`Each pack costs you: ${rows.slice(0,4).map(r=>`${esc(tidySize(r.label,'bulk',u))} <b>${ksh(per*r.size)}</b>`).join(' · ')}`; calc.hidden=false;}
    const packed=r3(rows.reduce((a,r)=>a+r.size*r.n,0)); if(!(packed>0)) return;
    pk.hidden=false;
    if(packed>AW.amt+1e-9){pk.classList.add('bad'); pk.innerHTML=`The packs add up to <b>${qty(packed,u)}</b>, more than the <b>${qty(AW.amt,u)}</b> you bought. Lower the numbers.`; return;}
    pk.innerHTML=`Packed <b>${qty(packed,u)}</b> of ${qty(AW.amt,u)}. <b>${qty(r3(AW.amt-packed),u)}</b> stays in bulk to pack later.`;
  } else if(AW.how==='sizes'){
    const n=[...f.querySelectorAll('.size')].reduce((a,r)=>a+(Math.floor(toNum(r.querySelector('.s-stock').value))||0),0); if(!n) return;
    pk.hidden=false;
    if(n>AW.amt){pk.classList.add('bad'); pk.innerHTML=`That is <b>${n}</b> pieces, more than the <b>${nf(AW.amt,0)}</b> you bought.`; return;}
    pk.innerHTML=`<b>${n}</b> of ${nf(AW.amt,0)} pieces listed.`+(AW.paid?' The price you paid is shared across the sizes by their selling price.':'');
  }
}
function awSave(){
  const f=$('#pf'), err=f.querySelector('#pf-err'), fail=m=>{err.textContent=m;err.hidden=false;err.scrollIntoView({block:'nearest'});};
  const u=AW.unit, amt=AW.amt, paid=AW.paid>0?AW.paid:0, per=paid?paid/amt:0, now=Date.now();
  if(!AW.how) return fail('Choose how you sell it.');
  if(byName(AW.name)) return fail(`${AW.name} is already in your shop.`);
  let t, packs=[];
  if(AW.how==='single'){
    const price=toNum(f.querySelector('#pf-s-price').value); if(!(price>0)) return fail(`Set the selling price per ${uOne(u)}.`);
    const n=Math.floor(amt+1e-9);
    if(u==='pcs'){ t={id:uid(),name:AW.name,mode:'ready',unit:'pc',bulk:0,cost:0,added:now}; packs.push({label:'',size:1,price,stock:n,cost:per}); }
    else { t={id:uid(),name:AW.name,mode:'bulk',unit:u,bulk:r3(amt-n),cost:per,ref:amt,added:now}; packs.push({label:canon(1,u),size:1,price,stock:n,cost:per}); }
  } else {
    const kind=AW.how==='sizes'?'ready':'bulk';
    const rows=[...f.querySelectorAll('.size')].map(r=>({label:tidySize(r.querySelector('.s-label').value,kind,u),price:toNum(r.querySelector('.s-price').value),n:Math.max(0,Math.floor(toNum(r.querySelector('.s-stock').value)||0)),size:toNum(r.querySelector('.s-size').value)})).filter(r=>r.label||r.price>0);
    if(!rows.length) return fail('Add at least one size you sell.');
    const seen=new Set();
    for(const r of rows){
      if(!r.label) return fail('Every size needs a name, like ¼ kg or 500 ml.');
      if(seen.has(r.label.toLowerCase())) return fail(`${r.label} is listed twice.`); seen.add(r.label.toLowerCase());
      if(!(r.price>0)) return fail(`Set a selling price for ${r.label}.`);
      if(kind==='bulk'){ const v=sizeIn(r.label,u); if(v) r.size=v; if(!(r.size>0)) return fail(`How many ${uName(u)} is ${r.label}? Write it under the size.`); }
    }
    if(kind==='bulk'){
      const packed=r3(rows.reduce((a,r)=>a+r.size*r.n,0));
      if(packed>amt+1e-9) return fail(`The packs add up to ${qty(packed,u)}, more than the ${qty(amt,u)} you bought.`);
      t={id:uid(),name:AW.name,mode:'bulk',unit:u,bulk:r3(amt-packed),cost:per,ref:amt,added:now};
      rows.forEach(r=>packs.push({label:r.label,size:r.size,price:r.price,stock:r.n,cost:per*r.size}));
    } else {
      const n=rows.reduce((a,r)=>a+r.n,0); if(n>amt) return fail(`That is ${n} pieces, more than the ${nf(amt,0)} you bought.`);
      const value=rows.reduce((a,r)=>a+r.n*r.price,0);
      t={id:uid(),name:AW.name,mode:'ready',unit:'pc',bulk:0,cost:0,added:now};
      rows.forEach(r=>packs.push({label:r.label,size:1,price:r.price,stock:r.n,cost:paid&&value?r.price*paid/value:0}));
    }
  }
  S.items.push(t); packs.forEach(p=>S.packs.push(Object.assign({id:uid(),itemId:t.id},p)));
  S.deliveries.push({id:uid(),ts:now,itemId:t.id,packId:null,qty:amt,paid});
  AW=null; closeSheet(); commit(); toast(`${t.name} added`);
}

/* delivery */
function openDelivery(id){
  const it=id?item(id):null;
  openSheet('delivery','Delivery came in',`
    <label class="fld"><span>What came in?</span><input id="dl-name" value="${esc(it?.name||'')}" placeholder="Start typing, e.g. su…" autocomplete="off"></label>
    <div id="dl-rest" class="sb"></div>`,b=>{
      const n=b.querySelector('#dl-name');
      suggest(n,()=>S.items.map(i=>i.name),()=>dlDraw());
      n.addEventListener('input',dlDraw); dlDraw(); if(!it) setTimeout(()=>n.focus(),60);
    });
}
function dlDraw(){
  const b=sheetBody(), name=b.querySelector('#dl-name').value, it=byName(name), box=b.querySelector('#dl-rest');
  if(box.dataset.for===(it?it.id:'')&&it) return;
  box.dataset.for=it?it.id:'';
  if(!it){box.innerHTML=name.trim()?`<p class="hint">${esc(name.trim())} is not in your shop yet.</p><button class="btn soft wide" data-act="product">+ Add it as a new product</button>`:''; return;}
  const ps=packsOf(it.id);
  if(it.mode==='bulk'){
    /* bulk: how much came and what it cost; selling prices can be changed at the same time */
    box.innerHTML=`<div class="two">
        <label class="fld"><span>Amount (${esc(uName(it.unit))})</span><input id="dl-qty" type="number" inputmode="decimal" min="0" step="any" placeholder="e.g. 50"></label>
        <label class="fld"><span>Total paid (Ksh)</span><input id="dl-paid" type="number" inputmode="decimal" min="0" step="any" placeholder="e.g. 7500"></label>
      </div>
      <p class="calc" id="dl-calc">Fill both to see the new buying price.</p>
      ${ps.length?`<p class="hint" style="font-weight:700;margin-bottom:-6px">Selling prices <span class="muted">(change them if the market moved)</span></p>
      <div class="panel">${ps.map(p=>`<div class="dl-row" data-pid="${p.id}"><span class="dl-l"><b>${esc(plab(p))}</b><small>${p.stock} on shelf</small></span><label class="fld"><span>Price</span><input class="dl-price" type="number" inputmode="decimal" min="0" step="any" value="${p.price}"></label></div>`).join('')}</div>`:''}
      <p class="err" id="dl-err" hidden></p>
      <button class="btn primary wide" data-act="delivery-save">Add to stock</button>`;
  } else {
    /* ready to sell: a row per size; new sizes can be added; one total price for everything */
    box.innerHTML=`<p class="hint" style="font-weight:700;margin-bottom:-6px">How many of each came?</p>
      <div class="panel" id="dl-rows">${ps.map(p=>dlRow(p)).join('')}</div>
      <button class="btn line" data-act="dl-newsize">+ A new size came</button>
      <label class="fld"><span>Total paid for all of it (Ksh)</span><input id="dl-paid" type="number" inputmode="decimal" min="0" step="any" placeholder="e.g. 1200"></label>
      <p class="calc" id="dl-calc">Fill in how many came and the total paid.</p>
      <p class="err" id="dl-err" hidden></p>
      <button class="btn primary wide" data-act="delivery-save">Add to stock</button>`;
  }
  if(!box.dataset.wired){box.dataset.wired='1'; box.addEventListener('input',dlCalc); box.addEventListener('change',dlCalc);}
  const first=box.querySelector('#dl-qty, .dl-n'); if(first) setTimeout(()=>first.focus(),40);
}
function dlRow(p){
  const isNew=!p, unl=p&&!p.label;
  return `<div class="dl-row${isNew?' new':''}" data-pid="${p?p.id:''}">
    ${isNew||unl?`<label class="fld dl-lab"><span>${isNew?'New size':'Size'}</span><input class="dl-label" placeholder="${isNew?'e.g. 800 g':'e.g. 400 g'}" autocomplete="off" value=""></label>`:`<span class="dl-l"><b>${esc(p.label)}</b><small>${p.stock} on shelf</small></span>`}
    <label class="fld"><span>Price</span><input class="dl-price" type="number" inputmode="decimal" min="0" step="any" value="${p?p.price:''}" placeholder="Ksh"></label>
    <label class="fld"><span>Came</span><input class="dl-n" type="number" inputmode="numeric" min="0" step="1" placeholder="0"></label>
    ${isNew?'<button type="button" class="x" data-act="dl-delrow" aria-label="Remove this size">×</button>':''}
  </div>`;
}
function dlReadRows(){
  return [...sheetBody().querySelectorAll('#dl-rows .dl-row')].map(r=>({r,pid:r.dataset.pid,label:r.querySelector('.dl-label')?tidyReady(r.querySelector('.dl-label').value):null,price:toNum(r.querySelector('.dl-price').value),n:Math.max(0,Math.floor(toNum(r.querySelector('.dl-n').value)||0))}));
}
function dlCalc(){
  const b=sheetBody(), it=byName(b.querySelector('#dl-name').value); if(!it) return; const c=b.querySelector('#dl-calc'), paid=toNum(b.querySelector('#dl-paid')?.value);
  if(it.mode==='bulk'){
    const q=toNum(b.querySelector('#dl-qty').value);
    if(!(q>0&&paid>=0)){c.textContent='Fill both to see the new buying price.';return;}
    const nw=paid/q, h=Math.max(0,it.bulk), avg=h>0&&it.cost?(it.cost*h+paid)/(h+q):nw;
    c.innerHTML=`This lot costs <b>${ksh(nw)}</b> per ${esc(uOne(it.unit))}${it.cost?` (before: ${ksh(it.cost)})`:''}.`+(h>0&&it.cost&&Math.abs(nw-it.cost)>0.5?` Mixed with the ${qty(h,it.unit)} you still have, it averages <b>${ksh(avg)}</b>.`:'');
    return;
  }
  const rows=dlReadRows().filter(x=>x.n>0), n=rows.reduce((a,x)=>a+x.n,0), val=rows.reduce((a,x)=>a+x.n*(x.price||0),0);
  if(!n){c.textContent='Fill in how many came and the total paid.';return;}
  if(!(paid>0)||!val){c.innerHTML=`<b>${n}</b> pieces came. Add the total paid to see what each one cost you.`;return;}
  c.innerHTML=`<b>${n}</b> pieces for ${ksh(paid)}. Each costs you about: `+rows.map(x=>`${esc(x.label||plab(pack(x.pid)||{}))} <b>${ksh(x.price*paid/val)}</b>`).join(' · ');
}
function dlSave(){
  const b=sheetBody(), it=byName(b.querySelector('#dl-name').value), err=b.querySelector('#dl-err'), fail=m=>{err.textContent=m;err.hidden=false;};
  if(!it) return;
  const paid=toNum(b.querySelector('#dl-paid').value), now=Date.now();
  if(b.querySelector('#dl-paid').value.trim()!==''&&!(paid>=0)) return fail('Write the total paid, or leave it empty.');
  if(it.mode==='bulk'){
    const q=toNum(b.querySelector('#dl-qty').value);
    if(!(q>0)) return fail('Enter how much came in.');
    if(!(paid>=0)) return fail('Enter what you paid. Put 0 if it was free.');
    const prices=[...b.querySelectorAll('.dl-row')].map(r=>({p:pack(r.dataset.pid),price:toNum(r.querySelector('.dl-price').value)}));
    for(const x of prices) if(!(x.price>0)) return fail(`Set a selling price for ${plab(x.p)}.`);
    const h=Math.max(0,it.bulk); it.cost=h>0&&it.cost?(it.cost*h+paid)/(h+q):paid/q; it.bulk=r3(it.bulk+q);
    prices.forEach(x=>{x.p.price=x.price;});
    S.deliveries.push({id:uid(),ts:now,itemId:it.id,packId:null,qty:q,paid});
    closeSheet(); commit(); toast(`Added ${qty(q,it.unit)} of ${it.name}`); return;
  }
  const rows=dlReadRows();
  const unl=rows.find(x=>x.pid&&x.label!==null), anyNew=rows.some(x=>!x.pid&&(x.label||x.n||x.price));
  const seen=new Set(packsOf(it.id).map(p=>(p.label||'').toLowerCase()).filter(Boolean));
  for(const x of rows){
    if(!x.pid&&!(x.label||x.n||x.price)) continue;
    if(!x.pid){ if(!x.label) return fail('Write the new size, like 800 g.'); if(seen.has(x.label.toLowerCase())) return fail(`${x.label} is already listed.`); seen.add(x.label.toLowerCase()); }
    if(!(x.price>0)) return fail(`Set a selling price for ${x.label||plab(pack(x.pid))}.`);
  }
  if(unl&&anyNew&&!unl.label) return fail(`Write the size of the ${it.name} you already have (e.g. 400 g), so the sizes don't mix up.`);
  const got=rows.filter(x=>x.n>0&&(x.pid||x.label)); if(!got.length) return fail('Write how many came of at least one size.');
  const val=got.reduce((a,x)=>a+x.n*x.price,0);
  rows.forEach(x=>{
    if(!x.pid&&!x.label) return;
    let p=x.pid?pack(x.pid):null;
    if(!p){p={id:uid(),itemId:it.id,label:x.label,size:1,price:x.price,stock:0,cost:0};S.packs.push(p);}
    if(x.pid&&x.label) p.label=x.label;
    p.price=x.price;
    if(x.n>0){ const each=paid>0&&val?x.price*paid/val:0, hv=Math.max(0,p.stock); p.cost=hv>0&&p.cost?(p.cost*hv+each*x.n)/(hv+x.n):each; p.stock+=x.n;
      S.deliveries.push({id:uid(),ts:now,itemId:it.id,packId:p.id,qty:x.n,paid:paid>0&&val?paid*x.n*x.price/val:0}); }
  });
  closeSheet(); commit(); toast(`Added ${got.reduce((a,x)=>a+x.n,0)} ${it.name} to stock`);
}

/* repack */
function openRepack(id){
  const it=item(id), ps=packsOf(id);
  openSheet('repack','Repack '+it.name,`
    <p class="hint">Bulk, not yet packed: <b>${qty(it.bulk,it.unit)}</b></p>
    <label class="fld"><span>How much bulk did you use? (${esc(uName(it.unit))})</span><input id="rp-used" type="number" inputmode="decimal" min="0" step="any" placeholder="e.g. 10"></label>
    <p class="hint" style="font-weight:700;margin-bottom:-6px">How many did you pack?</p>
    <div class="panel">${ps.map(p=>`<div class="line" style="grid-template-columns:1fr auto"><div><b>${esc(p.label)}</b><small>${p.stock} on shelf now</small></div><div class="step"><button type="button" data-act="rp" data-d="-1" data-id="${p.id}" aria-label="One less">−</button><input id="rp-${p.id}" type="number" inputmode="numeric" min="0" value="0" aria-label="${esc(p.label)} packed"><button type="button" data-act="rp" data-d="1" data-id="${p.id}" aria-label="One more">+</button></div></div>`).join('')}</div>
    <p class="calc" id="rp-calc"></p>
    <button class="btn primary wide" id="rp-save" data-act="repack-save" data-id="${id}">Save</button>`,b=>{b.addEventListener('input',()=>rpCalc(id)); rpCalc(id);});
}
function rpRead(id){
  const b=sheetBody(), it=item(id), used=toNum(b.querySelector('#rp-used').value);
  const made=packsOf(id).map(p=>({p,n:Math.max(0,Math.floor(toNum(b.querySelector('#rp-'+p.id).value)||0))}));
  return {b,it,used,made,packed:r3(made.reduce((a,m)=>a+m.p.size*m.n,0))};
}
function rpCalc(id){
  const {b,it,used,packed}=rpRead(id), c=b.querySelector('#rp-calc'), btn=b.querySelector('#rp-save');
  if(!(packed>0)){c.textContent='Add the packs you made.';btn.disabled=true;return;}
  if(!(used>0)){ if(packed>it.bulk+1e-9){c.innerHTML=`<span class="err">The packs add up to ${qty(packed,it.unit)}, but you only have ${qty(it.bulk,it.unit)} of bulk.</span>`;btn.disabled=true;return;}
    c.innerHTML=`Packed <b>${qty(packed,it.unit)}</b>. Write how much bulk you used to see any loss.`;btn.disabled=false;return;}
  if(used>it.bulk+1e-9){c.innerHTML=`<span class="err">You only have ${qty(it.bulk,it.unit)} of bulk. Record the delivery first if more came in.</span>`;btn.disabled=true;return;}
  const loss=r3(used-packed);
  if(loss<0){c.innerHTML=`<span class="err">That is more than the bulk you used. Check the numbers.</span>`;btn.disabled=true;return;}
  c.innerHTML=`Packed <b>${qty(packed,it.unit)}</b> of ${qty(used,it.unit)}. ${loss>0?`Lost <b>${qty(loss,it.unit)}</b>${it.cost?`, about ${ksh(loss*it.cost)}`:''}.`:'Nothing lost.'}`+(used>it.bulk+1e-9?`<br><span class="wrn">That is more than the ${qty(it.bulk,it.unit)} of bulk on record. Record the delivery first if one came in.</span>`:'');
  btn.disabled=false;
}
function rpSave(id){
  const {it,used,made,packed}=rpRead(id); if(!(packed>0)) return;
  const u=used>0?used:packed, loss=r3(u-packed); if(loss<0||u>it.bulk+1e-9) return;
  const cpu=(it.cost||0)*u/packed;
  made.filter(m=>m.n>0).forEach(({p,n})=>{const nc=cpu*p.size, h=Math.max(0,p.stock); p.cost=h>0&&p.cost?(p.cost*h+nc*n)/(h+n):nc; p.stock+=n;});
  it.bulk=r3(it.bulk-u);
  S.repacks.push({id:uid(),ts:Date.now(),itemId:id,used:u,made:made.filter(m=>m.n>0).map(m=>({packId:m.p.id,count:m.n})),packed,loss});
  closeSheet(); commit(); toast(`Packed ${qty(packed,it.unit)} of ${it.name}`);
}

function dbPickProduct(name){

  if(ps.length===1){ dbAdd(ps[0].id,1); b.querySelector('#db-prod').value=''; box.hidden=true; return; }

function dbAdd(pid,d){
  const p=pack(pid), it=p&&item(p.itemId); if(!it) return;
  const l=dbLines.find(x=>x.packId===pid), have=l?l.qty:0;
  if(d>0&&have+d>p.stock){ toast(`Only ${p.stock} ${fullName(it,p)} in stock.`); return; }
  if(l){ l.qty+=d; if(l.qty<=0) dbLines=dbLines.filter(x=>x!==l); } else if(d>0) dbLines.push({packId:pid,qty:d});
  dbDraw();
}
function dbDraw(){
  const b=sheetBody(), box=b.querySelector('#db-lines'), amt=b.querySelector('#db-amt');
  box.hidden=!dbLines.length; b.querySelector('#db-amt-note').hidden=!dbLines.length; amt.readOnly=!!dbLines.length;

      ${dateRow(p.ts)}
      <p class="err" id="de-err" hidden></p>
      <button class="btn primary wide" data-act="de-save" data-k="pay" data-id="${id}">Save changes</button>
      <button class="btn danger wide" data-act="de-del" data-k="pay" data-id="${id}">Delete this payment</button>`);
  } else {
    const x=S.sales.find(z=>z.id===id); if(!x) return;
    openSheet('dentry','Debt from a sale',`
      <div class="panel">${x.lines.map(l=>`<div class="kv"><span>${l.qty>1?l.qty+' × ':''}${esc(l.name)}</span><span>${ksh(l.price)}</span></div>`).join('')}<div class="kv"><span><b>Total</b> · ${day(x.ts)}</span><span>${ksh(x.total)}</span></div></div>
      <label class="fld"><span>Who owes you?</span><input id="de-name" value="${esc(x.customer)}" autocomplete="off"></label>
      <p class="err" id="de-err" hidden></p>
      <button class="btn primary wide" data-act="de-save" data-k="sale" data-id="${id}">Save name</button>
      <button class="btn soft wide" data-act="sale" data-id="${id}">Return items or cancel this sale</button>`,b=>suggest(b.querySelector('#de-name'),customers));
  }
}
function saveDebtEntry(k,id){
  const b=sheetBody(), err=b.querySelector('#de-err'), fail=m=>{err.textContent=m;err.hidden=false;};
  const match=n=>customers().find(c=>c.toLowerCase()===n.toLowerCase())||n;
  const keepTs=(old)=>{const v=b.querySelector('#de-date').value; if(v===isoDay(old)) return old; return tsFromIso(v);};
  let who;
  if(k==='debt'){
    const d=S.debts.find(x=>x.id===id), n=b.querySelector('#de-name').value.trim(), amt=toNum(b.querySelector('#de-amt').value), ts=keepTs(d.ts);
    if(!n) return fail('Write who owes you.'); if(!(amt>0)) return fail('Enter the amount.'); if(!ts) return fail('Pick a date that is today or earlier.');
    Object.assign(d,{customer:match(n),amount:amt,note:b.querySelector('#de-note').value.trim(),ts}); who=d.customer;
  } else if(k==='pay'){
    const p=S.payments.find(x=>x.id===id), amt=toNum(b.querySelector('#de-amt').value), ts=keepTs(p.ts), max=Math.max(0,(balances()[p.customer]||{owed:0}).owed)+p.amount;
    if(!(amt>0)) return fail('Enter the amount paid.'); if(amt>max+0.5) return fail(`That is more than the ${ksh(max)} they owed.`); if(!ts) return fail('Pick a date that is today or earlier.');
    Object.assign(p,{amount:amt,method:b.querySelector('input[name="de-m"]:checked').value,ts}); who=p.customer;
  } else {
    const x=S.sales.find(z=>z.id===id), n=b.querySelector('#de-name').value.trim(); if(!n) return fail('Write who owes you.');
    x.customer=match(n); who=x.customer;
  }
  commit(); openPerson(who); toast('Saved');
}
function deleteDebtEntry(k,id){
  const list=k==='debt'?S.debts:S.payments, e=list.find(x=>x.id===id); if(!e) return; const who=e.customer;
  if(k==='debt') S.debts=S.debts.filter(x=>x.id!==id); else S.payments=S.payments.filter(x=>x.id!==id);
  commit(); const left=customers().includes(who); if(left) openPerson(who); else closeSheet(); toast(k==='debt'?'Debt deleted':'Payment deleted');
}

function openSales(n){

function openSale(id){
  const x=S.sales.find(z=>z.id===id); if(!x){openSales();return;}
  openSheet('sale','Sale of '+ksh(x.total),`
    <p class="hint">${day(x.ts)} ${new Date(x.ts).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})} · ${payName(x.pay)}${x.pay==='deni'?' ('+esc(x.customer)+')':''}</p>
    <div class="panel">${x.lines.map((l,i)=>`<div class="line" style="grid-template-columns:1fr auto"><div><b>${l.qty>1?l.qty+' × ':''}${esc(l.name)}</b><small>${ksh(l.price)}</small></div><button class="btn soft" data-act="ret" data-id="${x.id}" data-i="${i}">Return 1</button></div>`).join('')}</div>
    ${x.returns&&x.returns.length?`<p class="hint">Already returned: ${esc(x.returns.map(r=>r.name).join(', '))}</p>`:''}
    <button class="btn danger wide" data-act="sale-cancel" data-id="${x.id}">Cancel the whole sale</button>
    <button class="btn line wide" data-act="sales">Back to recent sales</button>`);
}
function returnOne(id,i){
  const x=S.sales.find(z=>z.id===id); if(!x) return; const l=x.lines[i]; if(!l) return;
  const pp=l.price/l.qty, pc=l.cost/l.qty, pu=l.units/l.qty;
  if(l.k==='pack'){const p=pack(l.packId); if(p)p.stock+=1;} else {const it=item(l.itemId); if(it)it.bulk=r3(it.bulk+pu);}
  l.qty-=1; l.price-=pp; l.cost-=pc; l.units=r3(l.units-pu);
  if(l.qty<=0) x.lines.splice(i,1);
  x.total=x.lines.reduce((a,z)=>a+z.price,0); x.cost=x.lines.reduce((a,z)=>a+z.cost,0);
  (x.returns=x.returns||[]).push({ts:Date.now(),name:l.name,amount:pp});
  const msg=x.pay==='deni'?`Returned. ${x.customer}'s debt is ${ksh(pp)} less.`:`Returned. Give back ${ksh(pp)}.`;
  if(!x.lines.length){S.sales=S.sales.filter(z=>z.id!==id); commit(); closeSheet(); toast(msg); return;}
  commit(); openSale(id); toast(msg);
}
function cancelSale(id){
  const x=S.sales.find(z=>z.id===id); if(!x) return;
  applySale(x,+1); S.sales=S.sales.filter(z=>z.id!==id); commit(); closeSheet();
  toast(x.pay==='deni'?`Sale cancelled. ${x.customer}'s debt is ${ksh(x.total)} less.`:`Sale cancelled. Give back ${ksh(x.total)}.`);
}

function arm(btn,key,text,fn){
  if(armed===key){armed=null;fn();return;}
  armed=key; btn.dataset.o=btn.dataset.o||btn.textContent; btn.textContent=text; btn.classList.add('armed');
  setTimeout(()=>{if(armed===key){armed=null;btn.textContent=btn.dataset.o;btn.classList.remove('armed');}},4000);
}

document.addEventListener('click',e=>{
  const a=e.target.closest('[data-act]'); if(!a) return;
  const b=sheetBody(), act=a.dataset.act;
  switch(act){
    case 'tab': tab=a.dataset.tab; closeSheet(); $('#toast').hidden=true; render(); scrollTo(0,0); break;
    case 'period': period=a.dataset.p; render(); break;

    case 'ret': returnOne(a.dataset.id,+a.dataset.i); break;
