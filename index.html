    case 'sfilter': stockFilter=a.dataset.f; render(); break;
    case 'pick': {const ps=packsOf(a.dataset.id); if(ps.length===1){cartAdd(ps[0].id,1); drawTiles(); cartBar();} else openPicker(a.dataset.id); break;}
    case 'pk': {cartAdd(a.dataset.id,+a.dataset.d); const id=sheet&&sheet.dataset.item; if(id) b.innerHTML=pickerHTML(id); drawTiles(); cartBar(); break;}
    case 'more': if(a.dataset.w==='stock'){stockN+=PAGE;drawCards();} else {showN+=PAGE;drawTiles();} break;
    case 'cart': openCart(); break;
    case 'inc': {const c=cart[+a.dataset.i]; if(c.k==='pack') cartAdd(c.packId,1); refreshCart(); break;}
    case 'dec': {const c=cart[+a.dataset.i]; if(--c.qty<=0) cart.splice(+a.dataset.i,1); refreshCart(); break;}

      S.debts.push({id:uid(),ts,customer:who,amount:amt,note}); closeSheet(); commit(); toast(`${who} owes ${ksh(amt)} more`); break;}
    case 'db-size': dbAdd(a.dataset.id,1); b.querySelector('#db-prod').value=''; b.querySelector('#db-sizes').hidden=true; break;
    case 'db-q': dbAdd(a.dataset.id,+a.dataset.d); break;
    case 'db-entry': openDebtEntry(a.dataset.k,a.dataset.id); break;
    case 'de-save': saveDebtEntry(a.dataset.k,a.dataset.id); break;
    case 'de-del': arm(a,'dd'+a.dataset.id,'Tap again to delete',()=>deleteDebtEntry(a.dataset.k,a.dataset.id)); break;
    case 'pr-rename': b.querySelector('#pr-rename').hidden=false; a.hidden=true; b.querySelector('#pr-name').focus(); break;
    case 'pr-rename-save': {const from=a.dataset.c, to=b.querySelector('#pr-name').value.trim(); if(!to) return; const ex=customers().find(c=>c.toLowerCase()===to.toLowerCase()&&c!==from);
      renameCustomer(from,ex||to); commit(); openPerson(ex||to); toast(ex?`Joined with ${ex}`:'Name changed'); break;}
    case 'db-day': b.querySelector('#db-date').value=isoDay(Date.now()-(+a.dataset.d)*DAY); break;
    case 'person': openPerson(a.dataset.c); break;
    case 'paid': openPaid(a.dataset.c); break;
    case 'pd-set': b.querySelector('#pd-amt').value=a.dataset.v; break;
    case 'paid-save': {const c=a.dataset.c, amt=toNum(b.querySelector('#pd-amt').value), err=b.querySelector('#pd-err'), owed=Math.max(0,(balances()[c]||{owed:0}).owed);
      if(!(amt>0)){err.textContent='Enter the amount they paid.';err.hidden=false;return;}
      if(amt>owed+0.5){err.textContent=`That is more than the ${ksh(owed)} they owe.`;err.hidden=false;return;}
      S.payments.push({id:uid(),ts:Date.now(),customer:c,amount:amt,method:a.dataset.m}); closeSheet(); commit();
      const left=owed-amt; toast(`${c} paid ${ksh(amt)} by ${payName(a.dataset.m)}. `+(left>0.5?`${ksh(left)} still owed.`:'Debt cleared.')); break;}
    case 'settings': openSettings(); break;
    case 'st-name': S.shop=b.querySelector('#st-name').value.trim(); closeSheet(); commit(); break;
    case 'install': if(installEvt){installEvt.prompt(); installEvt.userChoice.finally(()=>{installEvt=null;closeSheet();});} break;
    case 'st-copy': {const txt=JSON.stringify(S), ta=b.querySelector('#st-backup'), fb=()=>{ta.value=txt;ta.select();toast('Select all the text in the box and copy it.');};
      try{navigator.clipboard.writeText(txt).then(()=>toast('Backup copied. Paste it somewhere safe, like WhatsApp to yourself.'),fb);}catch(x){fb();} break;}
    case 'st-restore': {let d=null; try{d=JSON.parse(b.querySelector('#st-backup').value);}catch(x){}
      if(!d||!Array.isArray(d.items)){const er=b.querySelector('#st-err');er.textContent='That is not a Doppler Shop backup. Paste the whole text.';er.hidden=false;return;}
      arm(a,'rs','Tap again to replace everything',()=>{S=Object.assign(blank(),d);cart=[];closeSheet();commit();toast('Backup restored');}); break;}
    case 'st-clear': arm(a,'cl','Tap again: this deletes all products and sales',()=>{S=blank();cart=[];closeSheet();tab='sell';commit();toast('Everything deleted');}); break;
    case 'close': closeSheet(); break;
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape') closeSheet();});
addEventListener('online',render); addEventListener('offline',render);
addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;});
addEventListener('appinstalled',()=>{installEvt=null;toast('Done. Open Doppler Shop from your home screen.');});

load(); render();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist();}catch(e){}
})();
</script>
</body>
</html>
